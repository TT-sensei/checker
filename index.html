<style>
:root{--green:#166534;--accent:#22c55e;--pale:#ecfdf3;--ink:#17231b;--muted:#647067;--line:#dce6de;--paper:#fff;--bg:#f5f7f4;--orange:#ea580c;--red:#b91c1c;--blue:#2563eb;--radius:14px;--shadow:0 3px 16px #143d2212}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(14px,calc((100vw - 1180px)/2))}.brand{font-size:19px;font-weight:800}.header-actions,.row,.actions,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.iconbtn,.navbtn{border:0;border-radius:8px;background:#ffffff18;color:#fff;padding:8px 11px}.nav{display:flex;overflow:auto;padding:0 max(10px,calc((100vw - 1200px)/2));scrollbar-width:none}.navbtn{white-space:nowrap;border-radius:9px 9px 0 0}.navbtn.active{background:var(--bg);color:var(--green);font-weight:700}.main{max-width:1180px;margin:auto;padding:20px 15px 70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.section{margin-bottom:22px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.section-title h2,.section-title h3{margin:0}.muted{color:var(--muted)}.tiny{font-size:13px}.summary{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:10px}.metric strong{font-size:25px;display:block;margin-top:4px}.rate strong{font-size:46px;color:var(--green)}.progress{height:9px;background:#e8eeea;border-radius:8px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.item-card{position:relative;border-top:5px solid var(--accent);cursor:pointer}.item-card h3{margin:0;font-size:18px}.item-head{display:flex;justify-content:space-between;gap:8px}.bigline{font-size:24px;font-weight:800;margin:12px 0 2px}.missing{background:#fff8ed;border-radius:9px;padding:10px;margin-top:12px;min-height:48px}.success{color:var(--green);font-weight:800;background:var(--pale)}.deadline{font-weight:700;color:var(--orange)}.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.person-row{display:flex;justify-content:space-between;gap:12px;padding:11px 3px;border-bottom:1px solid var(--line)}.person-row:last-child{border:0}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#eef3ef;font-size:13px}.warn{color:#9a3412;background:#fff7ed}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 13px;font-weight:600}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--red);border-color:#fecaca;background:#fff7f7}.btn.active{background:var(--pale);border-color:#86d69d;color:var(--green)}.search{min-width:220px;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}.tile{min-height:94px;border:2px solid var(--line);border-radius:11px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;position:relative;user-select:none}.tile:hover,.tile:focus{transform:translateY(-2px);box-shadow:var(--shadow)}.tile .num{font-size:22px;font-weight:800}.tile .name{font-size:13px;color:var(--muted);max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile.submitted{background:#1fa955;color:#fff;border-color:#15803d}.tile.submitted .name,.tile.late .name,.tile.resubmit .name,.tile.pending .name{color:inherit}.tile.late{background:#fff2df;border-color:#f97316}.tile.exempt{background:#e5e7eb;border-color:#9ca3af}.tile.resubmit{background:#fee2e2;border-color:#dc2626}.tile.pending{background:#dbeafe;border-color:#3b82f6}.tile.absent{background:repeating-linear-gradient(135deg,#fff,#fff 7px,#e5e7eb 7px,#e5e7eb 14px)}.mark{position:absolute;right:5px;top:4px;font-size:12px}.list-table{width:100%;border-collapse:collapse}.list-table th,.list-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}.chart-wrap{overflow:auto}.chart{min-width:520px;height:190px;display:flex;align-items:flex-end;gap:8px;padding:16px 8px 26px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}.bar{flex:1;min-width:30px;background:linear-gradient(#34d399,#15803d);border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;width:100%;text-align:center;font-size:11px}.bar b{position:absolute;top:-20px;width:100%;text-align:center;font-size:11px}.hbar{display:grid;grid-template-columns:120px 1fr 45px;gap:8px;align-items:center;margin:9px 0}.hbar div{height:12px;background:#e8eeea;border-radius:8px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--accent)}.person-dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}.person-stat{border-left:5px solid var(--accent)}.person-stat h3{margin:0 0 8px}.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}.statline b{display:block;font-size:21px}.modal-layer{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:17px;padding:22px;box-shadow:0 20px 60px #0004}.modal.wide{width:min(900px,100%)}.modal h2{margin-top:0}.field{margin:12px 0}.field label{font-weight:700;display:block;margin-bottom:5px}.input{width:100%;border:1px solid #bccac0;border-radius:8px;padding:9px 11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.calendar-weekday{text-align:center;font-size:12px;color:var(--muted);padding:4px}.calendar-day{min-height:72px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px;text-align:left}.calendar-day.other{opacity:.38}.calendar-day.selected{border:3px solid var(--green);background:var(--pale)}.calendar-day.today{box-shadow:inset 0 0 0 2px #fbbf24}.calendar-day b{display:block}.calendar-day small{display:block;margin-top:8px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:42px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:#173d24;color:#fff;padding:10px 18px;border-radius:30px;z-index:200;transition:.2s}.toast.show{transform:translate(-50%,0)}:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}.setup{text-align:center}.setup .card{max-width:520px;margin:8vh auto;text-align:left}.setup h1{text-align:center;color:var(--green)}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.rate{grid-column:1/-1}.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}@media(max-width:600px){.headrow{align-items:flex-start}.header-actions .text{display:none}.main{padding:14px 10px 60px}.cards,.summary,.formgrid{grid-template-columns:1fr}.rate{grid-column:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}.tile{min-height:82px}.filters{overflow:auto;flex-wrap:nowrap;width:100%}.btn{white-space:nowrap}.status-grid{grid-template-columns:1fr 1fr}.statline{grid-template-columns:repeat(2,1fr)}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}@media print{.header,.toolbar,.actions,.no-print{display:none!important}.main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}.cards{grid-template-columns:repeat(2,1fr)}body{background:#fff;color:#000}.progress span,.bar,.hbar i{background:#555!important}}
</style></head><body>
<header class="header"><div class="headrow"><div class="brand">📗 <span id="classTitle">学習トラッカー</span></div><div class="header-actions"><button class="iconbtn" data-action="roster" aria-label="名簿">👥 <span class="text">名簿</span></button><button class="iconbtn" data-action="settings" aria-label="設定">⚙️ <span class="text">設定</span></button><button class="iconbtn" data-action="sound" aria-label="効果音">🔔</button></div></div><nav class="nav" id="nav" aria-label="画面切り替え"></nav></header>
<main class="main" id="app"></main><div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><input id="fileInput" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='tracker-v4',OLD_KEY='tracker-v3',STATUSES={missing:['未提出','○'],submitted:['提出済み','✓'],late:['遅れて提出','△'],exempt:['免除','―'],resubmit:['再提出','↻'],pending:['確認待ち','?'],absent:['欠席','休']},COLORS={green:'#22c55e',blue:'#3b82f6',purple:'#a855f7',orange:'#f97316',teal:'#14b8a6',pink:'#ec4899'};
let state=null,ui={filter:'all',query:'',layout:'tile',period:'today',sort:'number',selected:new Set(),selecting:false,selectedDate:'',calendarMonth:''},pressTimer=0,longPressed=false,lastFocus=null;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const dateStr=(d=new Date())=>{let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)},today=()=>dateStr(),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fresh(){return{version:4,activeView:'dashboard',activeId:null,settings:{className:'',grade:'',classGroup:'',teacher:'',defaultCount:30,sound:true,excludeAbsent:true,autoExemptNonWorking:true,startView:'dashboard',dateFormat:'ja',weekStart:'monday',historyDays:30},roster:{},tabs:[],attendance:{},studentNotes:{}}}
function normalize(raw){let s=fresh();if(!raw||typeof raw!=='object')return s;Object.assign(s,raw);s.version=4;s.settings=Object.assign(fresh().settings,raw.settings||{});s.roster=raw.roster||{};s.attendance=raw.attendance||{};s.studentNotes=raw.studentNotes||{};s.tabs=Array.isArray(raw.tabs)?raw.tabs.map(t=>{let n=Object.assign({id:uid(),name:'提出物',color:'green',mode:'daily',count:s.settings.defaultCount,createdAt:today(),dueDate:'',dueTime:'',submissionDate:'',repeat:{type:'none',days:[]},note:'',labels:{},records:{}},t);if(!n.createdAt){let recorded=Object.values(n.records||{}).flatMap(x=>Object.keys(x)).sort();n.createdAt=recorded[0]||n.submissionDate||today()}Object.keys(n.records||{}).forEach(num=>Object.keys(n.records[num]||{}).forEach(d=>{let v=n.records[num][d];if(v===true)n.records[num][d]={status:'submitted',submittedAt:null,note:''};else if(v===false||v==null)delete n.records[num][d];else n.records[num][d]=Object.assign({status:'submitted',submittedAt:null,note:''},v)}));return n}):[];if(raw.activeId&&!s.tabs.some(t=>t.id===raw.activeId))s.activeId=null;return s}
function load(){try{let raw=localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY);state=normalize(raw?JSON.parse(raw):null);if(raw&&!localStorage.getItem(KEY))save()}catch(e){console.error(e);state=fresh();toast('保存データを読み込めなかったため、新規データで開始します')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.error(e);toast('保存できません。容量不足の可能性があります')}}
function toast(m){let e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function viewingDate(){return ui.selectedDate||today()}
function nameOf(tab,n){return tab.labels?.[n]||state.roster?.[n]?.name||state.roster?.[n]||''}function activeTab(){return state.tabs.find(t=>t.id===state.activeId)}
const holidayCache={};
function nthMonday(y,m,n){let d=new Date(y,m-1,1),first=1+(8-d.getDay())%7;return dateStr(new Date(y,m-1,first+(n-1)*7))}
function japaneseHolidays(y){if(holidayCache[y])return holidayCache[y];let h=new Map(),add=(m,d,n)=>h.set(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n),vernal=Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)),autumn=Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));
add(1,1,'元日');h.set(nthMonday(y,1,2),'成人の日');add(2,11,'建国記念の日');if(y>=2020)add(2,23,'天皇誕生日');add(3,vernal,'春分の日');add(4,29,'昭和の日');add(5,3,'憲法記念日');add(5,4,'みどりの日');add(5,5,'こどもの日');if(y===2020){add(7,23,'海の日');add(7,24,'スポーツの日');add(8,10,'山の日')}else if(y===2021){add(7,22,'海の日');add(7,23,'スポーツの日');add(8,8,'山の日')}else{h.set(nthMonday(y,7,3),'海の日');add(8,11,'山の日');h.set(nthMonday(y,10,2),'スポーツの日')}h.set(nthMonday(y,9,3),'敬老の日');add(9,autumn,'秋分の日');add(11,3,'文化の日');add(11,23,'勤労感謝の日');
if(y===2019){add(4,30,'国民の休日');add(5,1,'天皇の即位の日');add(5,2,'国民の休日');add(10,22,'即位礼正殿の儀')}let originals=[...h.keys()].sort();for(let i=0;i<originals.length-1;i++){let a=new Date(originals[i]+'T00:00:00'),b=new Date(originals[i+1]+'T00:00:00');if((b-a)===172800000){let mid=dateStr(new Date(a.getTime()+86400000));if(!h.has(mid))h.set(mid,'国民の休日')}}for(let key of originals){let d=new Date(key+'T00:00:00');if(d.getDay()===0){do d.setDate(d.getDate()+1);while(h.has(dateStr(d)));h.set(dateStr(d),'振替休日')}}return holidayCache[y]=h}
function nonWorkingDay(d=today()){let x=new Date(d+'T00:00:00'),weekend=x.getDay()===0||x.getDay()===6,holiday=japaneseHolidays(x.getFullYear()).get(d);return weekend?'土日':holiday||''}
function attendance(n,d=today()){return state.attendance?.[d]?.[n]||''}function record(tab,n,d=today()){if(attendance(n,d)==='absent')return{status:'absent'};let saved=tab.records?.[n]?.[d];if(saved)return saved;if(state.settings.autoExemptNonWorking&&nonWorkingDay(d))return{status:'exempt',note:nonWorkingDay(d),automatic:true};return{status:'missing',note:''}}
function counted(tab,n,d=today()){return !(state.settings.excludeAbsent&&attendance(n,d)==='absent')}function isDoneStatus(s){return['submitted','late','exempt'].includes(s)}
function deadline(tab){if(!tab.dueDate)return'';let a=new Date(today()+'T00:00:00'),b=new Date(tab.dueDate+'T00:00:00'),x=Math.round((b-a)/86400000);return x===0?'今日締切':x===1?'明日締切':x>1?`あと${x}日`:`${-x}日超過`}
function dailyStats(tab,d=today()){let total=0,done=0,missing=[];for(let n=1;n<=tab.count;n++){if(!counted(tab,n,d))continue;total++;let r=record(tab,n,d);if(isDoneStatus(r.status))done++;else missing.push(n)}return{total,done,missing,pct:total?Math.round(done/total*100):0}}
function datesForPeriod(p){let now=new Date(),start=new Date(now);if(p==='today')return[today()];if(p==='week'){let day=(now.getDay()+6)%7;start.setDate(now.getDate()-day)}else if(p==='7')start.setDate(now.getDate()-6);else if(p==='month')start=new Date(now.getFullYear(),now.getMonth(),1);else if(p==='30')start.setDate(now.getDate()-29);else{let all=state.tabs.flatMap(t=>Object.values(t.records||{}).flatMap(x=>Object.keys(x)));if(!all.length)return[today()];start=new Date(all.sort()[0]+'T00:00:00')}let out=[];while(start<=now){out.push(dateStr(start));start.setDate(start.getDate()+1)}return out}
function aggregate(dates=datesForPeriod(ui.period)){let total=0,done=0,late=0,overdue=0;state.tabs.forEach(t=>dates.forEach(d=>{for(let n=1;n<=t.count;n++){if(!counted(t,n,d))continue;total++;let r=record(t,n,d);if(isDoneStatus(r.status))done++;if(r.status==='late')late++;if(r.status==='missing'&&t.dueDate&&d>t.dueDate)overdue++}}));return{total,done,missing:total-done,late,overdue,pct:total?Math.round(done/total*100):0}}
function render(){renderNav();$('#classTitle').textContent=state.settings.className||'学習トラッカー';$('#app').innerHTML=state.activeView==='dashboard'?dashboardHTML():tabHTML(activeTab());bindDynamic()}
function renderNav(){let h=`<button class="navbtn ${state.activeView==='dashboard'?'active':''}" data-view="dashboard">📊 ダッシュボード</button>`;state.tabs.forEach(t=>h+=`<button class="navbtn ${state.activeView==='tab'&&state.activeId===t.id?'active':''}" data-tab="${t.id}"><span style="color:${COLORS[t.color]||COLORS.green}">●</span> ${esc(t.name)}</button>`);h+=`<button class="navbtn" data-action="add-tab">＋ 新しい提出物</button>`;$('#nav').innerHTML=h}
function dashboardHTML(){let a=aggregate(),todayA=aggregate([today()]),full=state.tabs.filter(t=>{let s=dailyStats(t);return s.total&&s.done===s.total}).length;return`<section class="section"><div class="section-title"><div><h2>今日の提出状況</h2><span class="muted">${new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date())}</span></div><select class="btn" id="period">${[['today','今日'],['week','今週'],['7','過去7日'],['month','今月'],['30','過去30日'],['all','全期間']].map(x=>`<option value="${x[0]}" ${ui.period===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="summary"><div class="card metric rate"><span>全体提出率（選択期間）</span><strong>${a.pct}%</strong><div class="progress"><span style="width:${a.pct}%"></span></div></div><div class="card metric"><span>提出物</span><strong>${state.tabs.length}<small> 項目</small></strong></div><div class="card metric"><span>今日 提出済み</span><strong>${todayA.done}<small> 件</small></strong></div><div class="card metric"><span>今日 未提出</span><strong>${todayA.missing}<small> 件</small></strong></div><div class="card metric"><span>全員提出</span><strong>${full}<small> 項目</small></strong></div></div><div class="row tiny muted" style="margin-top:8px">選択期間：遅れて提出 ${a.late}件・期限超過 ${a.overdue}件</div></section>${submissionCards()}<div class="two-col section"><section class="card"><div class="section-title"><h3>今日の未提出者一覧</h3><select id="missingSort" class="btn"><option value="number">出席番号順</option><option value="count">未提出数が多い順</option><option value="name">名前順</option></select></div>${missingPeople()}</section><section class="card"><h3>確認したい児童</h3>${watchPeople()}</section></div>${chartsHTML()}`}
function submissionCards(){if(!state.tabs.length)return`<section class="card empty section">提出物がありません。「＋ 新しい提出物」から追加してください。</section>`;return`<section class="section"><div class="section-title"><h2>提出物一覧</h2><button class="btn" data-action="print">🖨️ 印刷</button></div><div class="cards">${state.tabs.map(t=>{let s=dailyStats(t),dl=deadline(t);return`<article class="card item-card" data-tab="${t.id}" tabindex="0" style="border-top-color:${COLORS[t.color]||COLORS.green}"><div class="item-head"><h3>${esc(t.name)}</h3><span class="pill">${t.mode==='daily'?'毎日型':'手動型'}</span></div><div class="bigline">${s.done} / ${s.total}</div><div class="muted">提出率 ${s.pct}% ・ 未提出 ${s.missing.length}人</div><div class="progress"><span style="width:${s.pct}%;background:${COLORS[t.color]||COLORS.green}"></span></div>${dl?`<p class="deadline">⏰ ${dl}${t.dueTime?' '+esc(t.dueTime):''}</p>`:''}<div class="missing ${s.missing.length?'':'success'}">${s.missing.length?`<b>未提出</b><br>${s.missing.map(n=>`${n} ${esc(nameOf(t,n))}`).join('　')}`:'全員提出 🎉'}</div><button class="btn" style="margin-top:10px" data-tab="${t.id}">詳細を開く</button></article>`}).join('')}</div></section>`}
function missingData(){let map={};state.tabs.forEach(t=>dailyStats(t).missing.forEach(n=>{map[n]??=[];map[n].push(t.name)}));let arr=Object.entries(map).map(([n,items])=>({n:+n,name:nameOf(state.tabs[0]||{},n),items}));if(ui.sort==='count')arr.sort((a,b)=>b.items.length-a.items.length||a.n-b.n);else if(ui.sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else arr.sort((a,b)=>a.n-b.n);return arr}
function missingPeople(){let a=missingData();return a.length?a.map(x=>`<div class="person-row"><div><b>${x.n}番 ${esc(x.name)}</b><br><span class="muted">${x.items.map(esc).join('・')}</span></div><button class="btn" data-person="${x.n}">状態を変更</button></div>`).join(''):`<div class="empty success">今日の未提出はありません 🎉</div>`}
function studentRate(n,days){let total=0,done=0;state.tabs.forEach(t=>days.forEach(d=>{if(n<=t.count&&counted(t,n,d)){total++;if(isDoneStatus(record(t,n,d).status))done++}}));return total?Math.round(done/total*100):100}
function watchPeople(){let seven=datesForPeriod('7'),a=missingData().map(x=>({...x,rate:studentRate(x.n,seven)})).filter(x=>x.items.length>=2||x.rate<80);return a.length?a.slice(0,8).map(x=>`<div class="person-row"><div><b>${x.n}番 ${esc(x.name)}</b><br><span class="tiny muted">過去7日 ${x.rate}%・今日の未提出 ${x.items.length}件</span></div><span class="pill warn">確認</span></div>`).join(''):`<div class="empty">現在、確認条件に当てはまる児童はいません。</div>`}
function chartsHTML(){let ds=datesForPeriod(ui.period==='30'?'30':'7'),vals=ds.map(d=>aggregate([d]).pct);return`<section class="section"><div class="section-title"><h2>集計グラフ</h2></div><div class="two-col"><div class="card"><h3>日別提出率</h3><div class="chart-wrap"><div class="chart">${vals.map((v,i)=>`<div class="bar" style="height:${Math.max(v,2)}%"><b>${v}%</b><span>${ds[i].slice(5).replace('-','/')}</span></div>`).join('')}</div></div></div><div class="card"><h3>提出物別提出率</h3>${state.tabs.map(t=>{let s=dailyStats(t);return`<div class="hbar"><span>${esc(t.name)}</span><div><i style="width:${s.pct}%;background:${COLORS[t.color]||COLORS.green}"></i></div><b>${s.pct}%</b></div>`}).join('')||'<div class="empty">データなし</div>'}<h3>曜日別傾向</h3>${weekdayBars()}</div></div></section>`}
function weekdayBars(){let days=datesForPeriod('30'),names=['日','月','火','水','木','金','土'];return[1,2,3,4,5].map(w=>{let d=days.filter(x=>new Date(x+'T00:00:00').getDay()===w),p=d.length?Math.round(d.reduce((a,x)=>a+aggregate([x]).pct,0)/d.length):0;return`<div class="hbar"><span>${names[w]}曜日</span><div><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}
function tabHTML(t){if(!t)return`<div class="card empty">提出物を選択してください。</div>`;let d=viewingDate(),nums=[];for(let n=1;n<=t.count;n++){let r=record(t,n,d),over=r.status==='missing'&&t.dueDate&&d>t.dueDate,match=ui.filter==='all'||(ui.filter==='overdue'&&over)||r.status===ui.filter,q=ui.query.trim(),search=!q||String(n).includes(q)||nameOf(t,n).includes(q);if(match&&search)nums.push(n)}let s=dailyStats(t,d),label=d===today()?'今日':new Intl.DateTimeFormat('ja-JP',{dateStyle:'long'}).format(new Date(d+'T00:00:00'));return`<div class="section-title"><div><h2>${esc(t.name)}</h2><span class="muted">${label} ${s.done}/${s.total}（${s.pct}%）</span></div><div class="actions"><button class="btn primary" data-action="calendar">📅 カレンダー</button><button class="btn" data-action="person-dashboard">📊 個人記録</button><button class="btn" data-action="edit-tab">⚙️ 提出物設定</button></div></div><div class="progress section"><span style="width:${s.pct}%;background:${COLORS[t.color]||COLORS.green}"></span></div><div class="card section"><div class="toolbar"><div class="filters">${[['all','全員'],['submitted','提出済み'],['missing','未提出'],['late','遅れて提出'],['overdue','期限超過']].map(x=>`<button class="btn ${ui.filter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><div class="row"><input id="search" class="search" value="${esc(ui.query)}" placeholder="番号・名前を検索" aria-label="児童を検索"><button class="btn" data-layout="${ui.layout==='tile'?'list':'tile'}">${ui.layout==='tile'?'☷ 一覧':'▦ タイル'}</button></div></div><div class="toolbar"><div class="actions"><button class="btn primary" data-bulk="submitted">表示中を提出済み</button><button class="btn" data-bulk="missing">表示中を未提出</button><button class="btn" data-bulk="exempt">表示中を免除</button><button class="btn ${ui.selecting?'active':''}" data-action="select">☑ 複数選択</button></div><span class="muted">${nums.length}人を表示</span></div>${ui.layout==='tile'?tileGrid(t,nums,d):listView(t,nums,d)}</div><div class="actions"><button class="btn" data-action="check-all">✅ 全員チェック</button><button class="btn danger" data-action="reset-today">${label}分リセット</button><button class="btn danger" data-action="reset-all">全記録リセット</button></div>`}

function tileGrid(t,nums,d=viewingDate()){return`<div class="grid">${nums.map(n=>{let r=record(t,n,d),sel=ui.selected.has(n);return`<button class="tile ${r.status}" data-student="${n}" aria-label="${n}番 ${esc(nameOf(t,n))} ${STATUSES[r.status]?.[0]||'未提出'}" aria-pressed="${isDoneStatus(r.status)}" style="${sel?'outline:4px solid #fbbf24':''}"><span class="mark">${STATUSES[r.status]?.[1]||'○'}</span><span class="num">${n}</span><span class="name">${esc(nameOf(t,n)||'名前未登録')}</span><span class="tiny">${STATUSES[r.status]?.[0]||'未提出'}</span></button>`}).join('')}</div>`}
function listView(t,nums,d=viewingDate()){return`<div style="overflow:auto"><table class="list-table"><thead><tr><th>番号</th><th>名前</th><th>状態</th><th>提出日</th><th>遅れ</th><th>メモ</th></tr></thead><tbody>${nums.map(n=>{let r=record(t,n,d),late=r.status==='late'&&t.dueDate?Math.max(0,Math.ceil((new Date((r.submittedAt||today()).slice(0,10))-new Date(t.dueDate))/86400000)):0;return`<tr data-student="${n}" tabindex="0"><td>${n}</td><td><b>${esc(nameOf(t,n)||'—')}</b></td><td>${STATUSES[r.status]?.[1]} ${STATUSES[r.status]?.[0]}</td><td>${esc(r.submittedAt?.slice(0,10)||'—')}</td><td>${late?late+'日':'—'}</td><td>${esc(r.note||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function bindDynamic(){let p=$('#period');if(p)p.onchange=e=>{ui.period=e.target.value;render()};let s=$('#missingSort');if(s){s.value=ui.sort;s.onchange=e=>{ui.sort=e.target.value;render()}}let q=$('#search');if(q){q.oninput=e=>{ui.query=e.target.value;render();let n=$('#search');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
function setRecord(t,n,status,note,d=viewingDate()){t.records[n]??={};if(status==='missing'){if(state.settings.autoExemptNonWorking&&nonWorkingDay(d))t.records[n][d]={status:'missing',submittedAt:null,note:note||''};else delete t.records[n][d]}else t.records[n][d]={status,submittedAt:['submitted','late'].includes(status)?new Date().toISOString():null,note:note||t.records[n][d]?.note||''};save()}
function toggleStudent(n){let t=activeTab(),r=record(t,n,viewingDate());setRecord(t,n,r.status==='submitted'?'missing':'submitted');if(state.settings.sound&&r.status!=='submitted')beep();render()}
function beep(){try{let c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=720;g.gain.value=.08;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.stop(c.currentTime+.14)}catch(e){}}
function modal(html,wide=false){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-layer" role="presentation"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</section></div>`;setTimeout(()=>$('.modal input,.modal button')?.focus())}function closeModal(){$('#modalRoot').innerHTML='';lastFocus?.focus()}
function tabForm(t={}){modal(`<h2>${t.id?'提出物設定':'新しい提出物'}</h2><form id="tabForm"><div class="formgrid"><div class="field"><label>提出物名</label><input class="input" name="name" required value="${esc(t.name||'')}"></div><div class="field"><label>児童数</label><input class="input" name="count" type="number" min="1" max="300" value="${t.count||state.settings.defaultCount}"></div><div class="field"><label>モード</label><select class="input" name="mode"><option value="daily">毎日型</option><option value="manual" ${t.mode==='manual'?'selected':''}>手動型</option></select></div><div class="field"><label>色</label><select class="input" name="color">${Object.keys(COLORS).map(c=>`<option ${t.color===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>提出日</label><input class="input" name="submissionDate" type="date" value="${esc(t.submissionDate||'')}"></div><div class="field"><label>締切日・時刻</label><div class="row"><input class="input" style="flex:2" name="dueDate" type="date" value="${esc(t.dueDate||'')}"><input class="input" style="flex:1" name="dueTime" type="time" value="${esc(t.dueTime||'')}"></div></div><div class="field"><label>繰り返し</label><select class="input" name="repeat"><option value="none">なし</option><option value="daily">毎日</option><option value="weekday">平日のみ</option><option value="weekly">毎週</option><option value="custom">曜日指定</option></select></div><div class="field"><label>備考</label><input class="input" name="note" value="${esc(t.note||'')}"></div></div><div class="actions"><button class="btn primary">保存</button><button type="button" class="btn" data-close>キャンセル</button>${t.id?'<button type="button" class="btn danger" data-delete-tab>削除</button>':''}</div></form>`);$('#tabForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.count=+v.count;v.repeat={type:v.repeat,days:[]};if(t.id)Object.assign(t,v);else{v.id=uid();v.createdAt=today();v.labels={};v.records={};state.tabs.push(v);state.activeId=v.id;state.activeView='tab'}save();closeModal();render();toast('提出物を保存しました')}}
function calendarModal(){let t=activeTab(),base=new Date((ui.calendarMonth||viewingDate().slice(0,7))+'-01T00:00:00'),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),days=[];for(let i=0;i<42;i++){let x=new Date(start);x.setDate(start.getDate()+i);let d=dateStr(x),st=dailyStats(t,d);days.push(`<button class="calendar-day ${x.getMonth()!==m?'other':''} ${d===viewingDate()?'selected':''} ${d===today()?'today':''}" data-calendar-date="${d}"><b>${x.getDate()}</b><small>${st.done}/${st.total} 提出</small></button>`)}let title=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long'}).format(base);modal(`<div class="calendar-head"><button class="btn" data-calendar-move="-1" aria-label="前の月">←</button><h2>${title}</h2><button class="btn" data-calendar-move="1" aria-label="次の月">→</button></div><p class="muted">日付を選ぶと、その日の提出状況に戻って記入・修正できます。</p><div class="calendar-grid">${['月','火','水','木','金','土','日'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${days.join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" data-calendar-date="${today()}">今日へ</button><button class="btn" data-close>閉じる</button></div>`,true)}
function tabDatesForStudent(tab,n,days=state.settings.historyDays||30){let cutoff=new Date(today()+'T00:00:00');cutoff.setDate(cutoff.getDate()-days);let min=dateStr(cutoff);if(tab.mode==='manual'){let ds=Object.keys(tab.records?.[n]||{}).filter(d=>d>=min&&d<=today());if(!ds.includes(today()))ds.push(today());return ds.sort()}let start=new Date((tab.createdAt||today())+'T00:00:00');if(start<cutoff)start=cutoff;let now=new Date(today()+'T00:00:00'),out=[];while(start<=now){out.push(dateStr(start));start.setDate(start.getDate()+1)}return out}
function studentTabStats(tab,n){let dates=tabDatesForStudent(tab,n),counts={submitted:0,late:0,exempt:0,missing:0,resubmit:0,pending:0,absent:0};dates.forEach(d=>{let k=record(tab,n,d).status;counts[k]=(counts[k]||0)+1});let target=counts.submitted+counts.late+counts.missing+counts.resubmit+counts.pending,done=counts.submitted+counts.late;return{...counts,total:dates.length,rate:target?Math.round(done/target*100):100}}
function studentModal(n,tab=activeTab()){let d=viewingDate(),days=state.settings.historyDays||30,r=record(tab,n,d),perTab=state.tabs.map(t=>({tab:t,stats:studentTabStats(t,n)})),history=[];state.tabs.forEach(t=>Object.entries(t.records?.[n]||{}).forEach(([d,x])=>history.push({d,t:t.name,s:x.status,note:x.note})));history=history.filter(x=>x.d>=dateStr(new Date(Date.now()-days*86400000))).sort((a,b)=>b.d.localeCompare(a.d));modal(`<h2>📊 ${n}番 ${esc(nameOf(tab,n)||'名前未登録')} の個人ダッシュボード</h2><p class="muted">集計は提出物（タブ）ごとに独立しています。ほかのタブの記録とは混合しません。</p><div class="person-dashboard">${perTab.map(({tab:t,stats:x})=>`<section class="card person-stat" style="border-left-color:${COLORS[t.color]||COLORS.green}"><h3>${esc(t.name)}</h3><div class="bigline">提出率 ${x.rate}%</div><div class="statline"><span><b>${x.submitted}</b><small>提出済み</small></span><span><b>${x.late}</b><small>遅れて提出</small></span><span><b>${x.missing+x.resubmit+x.pending}</b><small>未完了</small></span><span><b>${x.exempt}</b><small>免除</small></span></div><p class="tiny muted">集計期間：過去${days}日〜今日${x.absent?` ・欠席 ${x.absent}日`:''}</p></section>`).join('')||'<p class="empty">提出物がありません。</p>'}</div><div class="field"><label>履歴の表示範囲（今日からさかのぼる日数）</label><div class="row"><input class="input" style="max-width:150px" id="historyDays" type="number" min="1" max="3650" value="${days}"><button class="btn" data-history-range="${n}">範囲を変更</button></div></div><h3>「${esc(tab.name)}」の${d===today()?'今日':d}の状態</h3>${r.automatic?`<p class="pill">自動免除：${esc(r.note)}</p>`:''}<div class="field"><div class="status-grid">${Object.entries(STATUSES).map(([k,v])=>`<button class="btn ${r.status===k?'active':''}" data-status="${k}" data-num="${n}">${v[1]} ${v[0]}</button>`).join('')}</div></div><div class="field"><label>${d===today()?'今日':d}の記録メモ</label><textarea class="input" id="recordNote" rows="2">${esc(r.note||'')}</textarea></div><div class="field"><label>教師用メモ</label><textarea class="input" id="studentNote" rows="2">${esc(state.studentNotes[n]||'')}</textarea></div><h3>最近の記録（タブ名を表示）</h3>${history.map(x=>`<div class="person-row"><span>${x.d}<br><b>${esc(x.t)}</b></span><span>${STATUSES[x.s]?.[0]||x.s} ${esc(x.note||'')}</span></div>`).join('')||'<p class="muted">手動で変更した記録はまだありません。土日・祝日の免除は上のタブ別集計に反映されます。</p>'}<div class="actions"><button class="btn primary" data-save-student="${n}">メモを保存</button><button class="btn" data-close>閉じる</button></div>`,true)}
function personPickerModal(){let t=activeTab();modal(`<h2>個人記録を選択</h2><p class="muted">番号を選ぶと、提出物ごとに分けたこれまでの記録を表示します。</p><div class="grid">${Array.from({length:t.count},(_,i)=>i+1).map(n=>`<button class="tile" data-person="${n}"><span class="num">${n}</span><span class="name">${esc(nameOf(t,n)||'名前未登録')}</span></button>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" data-close>閉じる</button></div>`,true)}
function rosterModal(){let max=Math.max(state.settings.defaultCount,...state.tabs.map(t=>t.count),1);modal(`<h2>クラス名簿</h2><p class="muted">名簿はすべての提出物に共通で使われます。</p><div style="max-height:60vh;overflow:auto"><table class="list-table"><thead><tr><th>番号</th><th>名前</th><th>欠席（今日）</th></tr></thead><tbody>${Array.from({length:max},(_,i)=>i+1).map(n=>`<tr><td>${n}</td><td><input class="input roster-name" data-num="${n}" value="${esc(state.roster[n]?.name||state.roster[n]||'')}"></td><td><input type="checkbox" class="absence" data-num="${n}" ${attendance(n)==='absent'?'checked':''}></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn primary" data-save-roster>保存</button><button class="btn" data-close>閉じる</button></div>`,true)}
function settingsModal(){let s=state.settings;modal(`<h2>全体設定</h2><div class="formgrid">${[['className','学級名',s.className],['grade','学年',s.grade],['classGroup','組',s.classGroup],['teacher','担任名',s.teacher]].map(x=>`<div class="field"><label>${x[1]}</label><input class="input setting" data-key="${x[0]}" value="${esc(x[2])}"></div>`).join('')}<div class="field"><label>標準の児童数</label><input class="input setting" data-key="defaultCount" type="number" value="${s.defaultCount}"></div><div class="field"><label>個人提出履歴の範囲（日）</label><input class="input setting" data-key="historyDays" type="number" min="1" max="3650" value="${s.historyDays||30}"></div><div class="field"><label>初期表示</label><select class="input setting" data-key="startView"><option value="dashboard">ダッシュボード</option><option value="last" ${s.startView==='last'?'selected':''}>最後の画面</option></select></div></div><label><input type="checkbox" id="excludeAbsent" ${s.excludeAbsent?'checked':''}> 欠席を未提出に含めない</label><br><label><input type="checkbox" id="autoExemptNonWorking" ${s.autoExemptNonWorking?'checked':''}> 土日・日本の祝日を自動で免除</label><br><label><input type="checkbox" id="soundSetting" ${s.sound?'checked':''}> 効果音</label><h3>データ</h3><div class="actions"><button class="btn" data-action="export-json">JSONバックアップ</button><button class="btn" data-action="import-json">JSON読み込み</button><button class="btn" data-action="csv">CSV書き出し</button><button class="btn" data-action="print">印刷</button></div><hr><div class="field"><label>全データ削除（「削除」と入力）</label><input class="input" id="deleteConfirm"></div><div class="actions"><button class="btn primary" data-save-settings>設定を保存</button><button class="btn danger" data-delete-all>全データ削除</button><button class="btn" data-close>閉じる</button></div>`)}
function setup(){document.body.innerHTML=`<main class="setup"><section class="card"><h1>📗 学習トラッカー</h1><p>最初に学級の基本情報を設定します。名前は後から登録できます。</p><form id="setup"><div class="field"><label>学級名</label><input class="input" name="className" placeholder="例：6年1組" required></div><div class="field"><label>児童数</label><input class="input" name="count" type="number" min="1" max="300" value="30" required></div><div class="field"><label>最初の提出物</label><input class="input" name="item" value="宿題" required></div><button class="btn primary" style="width:100%">すぐ始める</button></form></section></main>`;$('#setup').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),count=+f.get('count');state.settings.className=f.get('className');state.settings.defaultCount=count;state.tabs=[{id:uid(),name:f.get('item'),count,mode:'daily',color:'green',createdAt:today(),submissionDate:'',dueDate:'',dueTime:'',repeat:{type:'daily',days:[]},note:'',labels:{},records:{}}];save();location.reload()}}
function csvCell(v){let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return`"${s.replace(/"/g,'""')}"`}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){let rows=[['日付','出席番号','名前','提出物名','状態','提出日時','締切日','遅れ日数','メモ']];state.tabs.forEach(t=>{let dates=new Set([today(),...Object.values(t.records).flatMap(r=>Object.keys(r))]);dates.forEach(d=>{for(let n=1;n<=t.count;n++){let r=record(t,n,d),late=r.status==='late'&&t.dueDate?Math.max(0,Math.ceil((new Date(d)-new Date(t.dueDate))/86400000)):0;rows.push([d,n,nameOf(t,n),t.name,STATUSES[r.status]?.[0],r.submittedAt||'',t.dueDate||'',late,r.note||''])}})});download(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`学習トラッカー-${today()}.csv`);toast('CSVを書き出しました')}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-tab],[data-student]');if(!b)return;let act=b.dataset.action;if(b.dataset.calendarDate){ui.selectedDate=b.dataset.calendarDate;ui.calendarMonth=ui.selectedDate.slice(0,7);closeModal();render();toast(`${ui.selectedDate}の記録を表示しています`)}else if(b.dataset.calendarMove){let x=new Date((ui.calendarMonth||viewingDate().slice(0,7))+'-01T00:00:00');x.setMonth(x.getMonth()+(+b.dataset.calendarMove));ui.calendarMonth=dateStr(x).slice(0,7);calendarModal()}else if(b.dataset.historyRange){let days=Math.max(1,Math.min(3650,+$('#historyDays').value||30));state.settings.historyDays=days;save();studentModal(+b.dataset.historyRange,activeTab()||state.tabs[0]);toast(`履歴を過去${days}日間に変更しました`)}else if(b.dataset.view){state.activeView='dashboard';save();render()}else if(b.dataset.tab){state.activeId=b.dataset.tab;state.activeView='tab';ui.filter='all';save();render()}else if(b.dataset.filter){ui.filter=b.dataset.filter;render()}else if(b.dataset.layout){ui.layout=b.dataset.layout;render()}else if(b.dataset.student){let n=+b.dataset.student;if(longPressed){longPressed=false;return}if(ui.selecting){ui.selected.has(n)?ui.selected.delete(n):ui.selected.add(n);render()}else toggleStudent(n)}else if(b.dataset.person)studentModal(+b.dataset.person,activeTab()||state.tabs[0]);else if(b.dataset.status){let t=activeTab()||state.tabs[0],n=+b.dataset.num;if(b.dataset.status==='absent'){state.attendance[viewingDate()]??={};state.attendance[viewingDate()][n]='absent';save()}else{if(state.attendance[viewingDate()])delete state.attendance[viewingDate()][n];setRecord(t,n,b.dataset.status,$('#recordNote')?.value)}studentModal(n,t);render()}else if(b.dataset.bulk){let t=activeTab(),nums=$$('[data-student]').map(x=>+x.dataset.student);if(confirm(`${nums.length}人の状態を変更しますか？`)){nums.forEach(n=>setRecord(t,n,b.dataset.bulk));render()}}else if(b.dataset.close!==undefined)closeModal();else if(b.dataset.saveStudent){let n=+b.dataset.saveStudent,t=activeTab()||state.tabs[0],r=record(t,n,viewingDate());if(r.status!=='absent')setRecord(t,n,r.status,$('#recordNote').value);state.studentNotes[n]=$('#studentNote').value;save();closeModal();render();toast('メモを保存しました')}else if(b.dataset.saveRoster!==undefined){state.attendance[today()]={};$$('.roster-name').forEach(x=>{let n=x.dataset.num,v=x.value.trim();if(v)state.roster[n]={name:v,note:state.roster[n]?.note||''};else delete state.roster[n]});$$('.absence:checked').forEach(x=>state.attendance[today()][x.dataset.num]='absent');save();closeModal();render();toast('名簿と出欠を保存しました')}else if(b.dataset.saveSettings!==undefined){$$('.setting').forEach(x=>state.settings[x.dataset.key]=x.type==='number'?+x.value:x.value);state.settings.excludeAbsent=$('#excludeAbsent').checked;state.settings.autoExemptNonWorking=$('#autoExemptNonWorking').checked;state.settings.sound=$('#soundSetting').checked;save();closeModal();render()}else if(b.dataset.deleteTab!==undefined){if(confirm('この提出物と全記録を削除しますか？')){state.tabs=state.tabs.filter(x=>x.id!==activeTab().id);state.activeView='dashboard';save();closeModal();render()}}else if(b.dataset.deleteAll!==undefined){if($('#deleteConfirm').value==='削除'){localStorage.removeItem(KEY);localStorage.removeItem(OLD_KEY);location.reload()}else toast('確認欄に「削除」と入力してください')}else if(act==='calendar')calendarModal();else if(act==='person-dashboard')personPickerModal();else if(act==='add-tab')tabForm();else if(act==='edit-tab')tabForm(activeTab());else if(act==='roster')rosterModal();else if(act==='settings')settingsModal();else if(act==='sound'){state.settings.sound=!state.settings.sound;save();toast(state.settings.sound?'効果音オン':'効果音オフ')}else if(act==='select'){ui.selecting=!ui.selecting;ui.selected.clear();render()}else if(act==='check-all'){if(confirm('全員を提出済みにしますか？')){let t=activeTab();for(let n=1;n<=t.count;n++)setRecord(t,n,'submitted');render()}}else if(act==='reset-today'){if(confirm(`${viewingDate()}分を未提出に戻しますか？`)){let t=activeTab();for(let n=1;n<=t.count;n++)setRecord(t,n,'missing');render()}}else if(act==='reset-all'){if(confirm('この提出物の全記録を削除しますか？')){activeTab().records={};save();render()}}else if(act==='export-json')download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),`学習トラッカー-${today()}.json`);else if(act==='import-json')$('#fileInput').click();else if(act==='csv')exportCSV();else if(act==='print')window.print()});
document.addEventListener('pointerdown',e=>{let x=e.target.closest('[data-student]');if(!x)return;longPressed=false;pressTimer=setTimeout(()=>{longPressed=true;studentModal(+x.dataset.student)},550)});document.addEventListener('pointerup',()=>clearTimeout(pressTimer));document.addEventListener('pointermove',()=>clearTimeout(pressTimer));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-student]'))studentModal(+e.target.dataset.student)});document.addEventListener('click',e=>{if(e.target.classList.contains('modal-layer'))closeModal()});
$('#fileInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tabs))throw Error('tabs');if(confirm('現在のデータを読み込んだデータで置き換えますか？')){state=normalize(d);save();closeModal();render();toast('JSONを読み込みました')}}catch(err){alert('正しい学習トラッカーのJSONではありません')}e.target.value=''};r.readAsText(f)};
load();if(!state.settings.className&&!state.tabs.length)setup();else{if(state.settings.startView==='dashboard')state.activeView='dashboard';render();setInterval(()=>{let d=today();if(window._day&&window._day!==d){render();toast('日付が変わりました')}window._day=d},60000)}
</script></body></html>
