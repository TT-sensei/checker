<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#174f3b">
  <meta name="description" content="小学校教員向けの、端末内で完結する提出物管理アプリです。">
  <title>学習トラッカー</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>

  <header class="app-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✓</span>
      <div>
        <h1>学習トラッカー</h1>
        <p id="class-label">学級を設定してください</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="save-indicator" class="save-indicator" role="status">この端末に保存</span>
      <button class="icon-button" id="print-button" type="button" aria-label="現在の画面を印刷">
        <span aria-hidden="true">印刷</span>
      </button>
      <button class="icon-button" data-view="settings" type="button" aria-label="設定画面を開く">
        <span aria-hidden="true">設定</span>
      </button>
    </div>
  </header>

  <div class="app-layout">
    <nav class="side-nav" aria-label="メインメニュー">
      <button class="nav-button is-active" data-view="dashboard" type="button">
        <span class="nav-icon" aria-hidden="true">▦</span>
        <span>ダッシュボード</span>
      </button>
      <button class="nav-button" data-view="daily" type="button">
        <span class="nav-icon" aria-hidden="true">日</span>
        <span>毎日型</span>
      </button>
      <button class="nav-button" data-view="deadline" type="button">
        <span class="nav-icon" aria-hidden="true">〆</span>
        <span>締め切り型</span>
      </button>
      <button class="nav-button" data-view="student" type="button">
        <span class="nav-icon" aria-hidden="true">人</span>
        <span>個人</span>
      </button>
      <button class="nav-button" data-view="settings" type="button">
        <span class="nav-icon" aria-hidden="true">⚙</span>
        <span>設定</span>
      </button>

      <section class="side-section" aria-labelledby="quick-items-label">
        <h2 id="quick-items-label">提出物</h2>
        <div id="quick-items" class="quick-items"></div>
      </section>
    </nav>

    <main id="main-content" class="main-content" tabindex="-1">
      <div id="app-view" aria-live="polite"></div>
    </main>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <input id="json-file-input" type="file" accept="application/json,.json" hidden>

  <script src="./core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
