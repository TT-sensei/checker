<title>学習トラッカー v5</title>
<style>
:root{--green:#166534;--accent:#22c55e;--pale:#ecfdf3;--ink:#17231b;--muted:#647067;--line:#dce6de;--paper:#fff;--bg:#f5f7f4;--orange:#ea580c;--red:#b91c1c;--blue:#2563eb;--gray:#6b7280;--radius:14px;--shadow:0 3px 16px #143d2212}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;font-size:15px}button,input,select,textarea{font:inherit}button{cursor:pointer}.header{position:sticky;top:0;z-index:20;background:var(--green);color:#fff}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px max(14px,calc((100vw - 1180px)/2))}.brand{font-size:19px;font-weight:800}.header-actions,.row,.actions,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.iconbtn,.navbtn{border:0;border-radius:8px;background:#ffffff18;color:#fff;padding:8px 11px}.nav{display:flex;overflow:auto;padding:0 max(10px,calc((100vw - 1200px)/2));scrollbar-width:none}.navbtn{white-space:nowrap;border-radius:9px 9px 0 0}.navbtn.active{background:var(--bg);color:var(--green);font-weight:700}.main{max-width:1180px;margin:auto;padding:20px 15px 70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.section{margin-bottom:22px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}.section-title h2,.section-title h3{margin:0}.muted{color:var(--muted)}.tiny{font-size:13px}.summary{display:grid;grid-template-columns:1.7fr repeat(4,1fr);gap:10px}.metric strong{font-size:25px;display:block;margin-top:4px}.rate strong{font-size:46px;color:var(--green)}.progress{height:9px;background:#e8eeea;border-radius:8px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--accent);border-radius:inherit}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.item-card{position:relative;border-top:5px solid var(--accent);cursor:pointer}.item-card h3{margin:0;font-size:18px}.item-head{display:flex;justify-content:space-between;gap:8px}.bigline{font-size:24px;font-weight:800;margin:12px 0 2px}.missing{background:#fff8ed;border-radius:9px;padding:10px;margin-top:12px;min-height:48px}.success{color:var(--green);font-weight:800;background:var(--pale)}.deadline{font-weight:700;color:var(--orange)}.two-col{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.person-row{display:flex;justify-content:space-between;gap:12px;padding:11px 3px;border-bottom:1px solid var(--line)}.person-row:last-child{border:0}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#eef3ef;font-size:13px}.warn{color:#9a3412;background:#fff7ed}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:9px 13px;font-weight:600}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{color:var(--red);border-color:#fecaca;background:#fff7f7}.btn.active{background:var(--pale);border-color:#86d69d;color:var(--green)}.search{min-width:220px;border:1px solid var(--line);border-radius:9px;padding:9px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}.tile{min-height:94px;border:2px solid var(--line);border-radius:11px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;position:relative;user-select:none}.tile:hover,.tile:focus{transform:translateY(-2px);box-shadow:var(--shadow)}.tile .num{font-size:22px;font-weight:800}.tile .name{font-size:13px;color:var(--muted);max-width:85px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile.submitted{background:#1fa955;color:#fff;border-color:#15803d}.tile.submitted .name,.tile.late .name,.tile.resubmit .name,.tile.pending .name{color:inherit}.tile.late{background:#fff2df;border-color:#f97316}.tile.exempt{background:#e5e7eb;border-color:#9ca3af}.tile.resubmit{background:#fee2e2;border-color:#dc2626}.tile.pending{background:#dbeafe;border-color:#3b82f6}.tile.absent{background:repeating-linear-gradient(135deg,#fff,#fff 7px,#e5e7eb 7px,#e5e7eb 14px)}.tile.notTarget{background:#f8fafc;border-style:dashed;color:#94a3b8}.tile.notTarget .name{color:#94a3b8}.mark{position:absolute;right:5px;top:4px;font-size:12px}.list-table{width:100%;border-collapse:collapse}.list-table th,.list-table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.list-table tr:hover td{background:#fafcf9}.chart-wrap{overflow:auto}.chart{min-width:520px;height:190px;display:flex;align-items:flex-end;gap:8px;padding:16px 8px 26px;border-left:1px solid var(--line);border-bottom:1px solid var(--line)}.bar{flex:1;min-width:30px;background:linear-gradient(#34d399,#15803d);border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;width:100%;text-align:center;font-size:11px}.bar b{position:absolute;top:-20px;width:100%;text-align:center;font-size:11px}.hbar{display:grid;grid-template-columns:120px 1fr 45px;gap:8px;align-items:center;margin:9px 0}.hbar div{height:12px;background:#e8eeea;border-radius:8px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--accent)}.person-dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0}.person-stat{border-left:5px solid var(--accent)}.person-stat h3{margin:0 0 8px}.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;text-align:center}.statline b{display:block;font-size:21px}.overall-box{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:10px;margin:12px 0}.overall-box .card{box-shadow:none}.overall-rate strong{font-size:40px;color:var(--green)}.modal-layer{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modal{background:#fff;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:17px;padding:22px;box-shadow:0 20px 60px #0004}.modal.wide{width:min(1040px,100%)}.modal h2{margin-top:0}.field{margin:12px 0}.field label{font-weight:700;display:block;margin-bottom:5px}.input{width:100%;border:1px solid #bccac0;border-radius:8px;padding:9px 11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}.calendar-weekday{text-align:center;font-size:12px;color:var(--muted);padding:4px}.calendar-day{min-height:72px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:7px;text-align:left}.calendar-day.other{opacity:.38}.calendar-day.selected{border:3px solid var(--green);background:var(--pale)}.calendar-day.today{box-shadow:inset 0 0 0 2px #fbbf24}.calendar-day.nontarget{background:#f8fafc;color:#94a3b8}.calendar-day b{display:block}.calendar-day small{display:block;margin-top:8px;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:42px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:#173d24;color:#fff;padding:10px 18px;border-radius:30px;z-index:200;transition:.2s}.toast.show{transform:translate(-50%,0)}.notice{border:1px solid #bfdbfe;background:#eff6ff;color:#1e3a8a;border-radius:10px;padding:11px 13px}.rangebar{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.weekday-box{display:flex;gap:8px;flex-wrap:wrap}.weekday-box label{font-weight:500;background:#f3f6f4;padding:7px 9px;border-radius:8px}.status-text{font-weight:700}.status-text.missing,.status-text.resubmit{color:var(--red)}.status-text.late{color:var(--orange)}.status-text.submitted{color:var(--green)}:focus-visible{outline:3px solid #fbbf24;outline-offset:2px}.setup{text-align:center}.setup .card{max-width:520px;margin:8vh auto;text-align:left}.setup h1{text-align:center;color:var(--green)}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.rate{grid-column:1/-1}.cards{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.overall-box{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.headrow{align-items:flex-start}.header-actions .text{display:none}.main{padding:14px 10px 60px}.cards,.summary,.formgrid,.overall-box{grid-template-columns:1fr}.rate{grid-column:auto}.grid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}.tile{min-height:82px}.filters{overflow:auto;flex-wrap:nowrap;width:100%}.btn{white-space:nowrap}.status-grid{grid-template-columns:1fr 1fr}.statline{grid-template-columns:repeat(2,1fr)}}@media print{.header,.toolbar,.actions,.no-print{display:none!important}.main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}.cards{grid-template-columns:repeat(2,1fr)}body{background:#fff;color:#000}.progress span,.bar,.hbar i{background:#555!important}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<header class="header"><div class="headrow"><div class="brand">📗 <span id="classTitle">学習トラッカー</span></div><div class="header-actions"><button class="iconbtn" data-action="roster" aria-label="名簿">👥 <span class="text">名簿</span></button><button class="iconbtn" data-action="settings" aria-label="設定">⚙️ <span class="text">設定</span></button><button class="iconbtn" data-action="sound" aria-label="効果音">🔔</button></div></div><nav class="nav" id="nav" aria-label="画面切り替え"></nav></header>
<main class="main" id="app"></main><div id="modalRoot"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><input id="fileInput" type="file" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY='tracker-v5',OLD_KEYS=['tracker-v4','tracker-v3'];
const STATUSES={missing:['未提出','○'],submitted:['提出済み','✓'],late:['遅れて提出','△'],exempt:['免除','―'],resubmit:['再提出','↻'],pending:['確認待ち','?'],absent:['欠席','休'],notTarget:['対象外','・']};
const COLORS={green:'#22c55e',blue:'#3b82f6',purple:'#a855f7',orange:'#f97316',teal:'#14b8a6',pink:'#ec4899'};
let state=null;
let ui={filter:'all',query:'',layout:'tile',period:'today',sort:'number',selected:new Set(),selecting:false,selectedDate:'',calendarMonth:'',studentMonth:'',studentRange:'month'};
let pressTimer=0,longPressed=false,lastFocus=null;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const dateStr=(d=new Date())=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const localStamp=()=>{const d=new Date(),z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,19)};
const today=()=>dateStr(),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return dateStr(x)};
const dateRange=(start,end)=>{const out=[];if(!start||!end||start>end)return out;let d=start;while(d<=end){out.push(d);d=addDays(d,1)}return out};
function fresh(){return{version:5,activeView:'dashboard',activeId:null,settings:{className:'',grade:'',classGroup:'',teacher:'',defaultCount:30,sound:true,excludeAbsent:true,autoExemptNonWorking:true,startView:'dashboard',dateFormat:'ja',weekStart:'monday',historyDays:30},roster:{},tabs:[],attendance:{},studentNotes:{}}}
function normalize(raw){
  const base=fresh();if(!raw||typeof raw!=='object')return base;const s=Object.assign(base,raw);s.version=5;s.settings=Object.assign(fresh().settings,raw.settings||{});s.roster=raw.roster||{};s.attendance=raw.attendance||{};s.studentNotes=raw.studentNotes||{};
  s.tabs=Array.isArray(raw.tabs)?raw.tabs.map(t=>{
    const n=Object.assign({id:uid(),name:'提出物',color:'green',mode:'daily',count:s.settings.defaultCount,createdAt:today(),dueDate:'',dueTime:'',submissionDate:'',repeat:{type:'daily',days:[]},note:'',labels:{},records:{},exemptDates:{}},t);
    n.exemptDates=n.exemptDates||{};n.records=n.records||{};n.labels=n.labels||{};
    if(!n.createdAt){const recorded=Object.values(n.records).flatMap(x=>Object.keys(x)).sort();n.createdAt=recorded[0]||n.submissionDate||n.dueDate||today()}
    if(!n.repeat||typeof n.repeat!=='object')n.repeat={type:n.mode==='daily'?'daily':'none',days:[]};
    if(n.mode==='daily'&&(!n.repeat.type||n.repeat.type==='none'))n.repeat.type='daily';
    n.repeat.days=Array.isArray(n.repeat.days)?n.repeat.days.map(Number):[];
    Object.keys(n.records).forEach(num=>Object.keys(n.records[num]||{}).forEach(d=>{const v=n.records[num][d];if(v===true)n.records[num][d]={status:'submitted',submittedAt:null,note:''};else if(v===false||v==null)delete n.records[num][d];else n.records[num][d]=Object.assign({status:'submitted',submittedAt:null,note:''},v)}));
    return n;
  }):[];
  if(raw.activeId&&!s.tabs.some(t=>t.id===raw.activeId))s.activeId=null;return s;
}
function load(){try{let raw=localStorage.getItem(KEY);if(!raw){for(const k of OLD_KEYS){raw=localStorage.getItem(k);if(raw)break}}state=normalize(raw?JSON.parse(raw):null);save()}catch(e){console.error(e);state=fresh();toast('保存データを読み込めなかったため、新規データで開始します')}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.error(e);toast('保存できません。容量不足の可能性があります')}}
function toast(m){const e=$('#toast');if(!e)return;e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function viewingDate(){return ui.selectedDate||today()}
function activeTab(){return state.tabs.find(t=>t.id===state.activeId)}
function nameOf(tab,n){return tab?.labels?.[n]||state.roster?.[n]?.name||state.roster?.[n]||''}
function anchorDate(tab){return tab.submissionDate||tab.dueDate||tab.createdAt||today()}
const holidayCache={};
function nthMonday(y,m,n){const d=new Date(y,m-1,1),first=1+(8-d.getDay())%7;return dateStr(new Date(y,m-1,first+(n-1)*7))}
function japaneseHolidays(y){if(holidayCache[y])return holidayCache[y];const h=new Map(),add=(m,d,n)=>h.set(`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,n),vernal=Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)),autumn=Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4));add(1,1,'元日');h.set(nthMonday(y,1,2),'成人の日');add(2,11,'建国記念の日');if(y>=2020)add(2,23,'天皇誕生日');add(3,vernal,'春分の日');add(4,29,'昭和の日');add(5,3,'憲法記念日');add(5,4,'みどりの日');add(5,5,'こどもの日');if(y===2020){add(7,23,'海の日');add(7,24,'スポーツの日');add(8,10,'山の日')}else if(y===2021){add(7,22,'海の日');add(7,23,'スポーツの日');add(8,8,'山の日')}else{h.set(nthMonday(y,7,3),'海の日');add(8,11,'山の日');h.set(nthMonday(y,10,2),'スポーツの日')}h.set(nthMonday(y,9,3),'敬老の日');add(9,autumn,'秋分の日');add(11,3,'文化の日');add(11,23,'勤労感謝の日');if(y===2019){add(4,30,'国民の休日');add(5,1,'天皇の即位の日');add(5,2,'国民の休日');add(10,22,'即位礼正殿の儀')}const originals=[...h.keys()].sort();for(let i=0;i<originals.length-1;i++){const a=new Date(originals[i]+'T00:00:00'),b=new Date(originals[i+1]+'T00:00:00');if((b-a)===172800000){const mid=dateStr(new Date(a.getTime()+86400000));if(!h.has(mid))h.set(mid,'国民の休日')}}for(const key of originals){const d=new Date(key+'T00:00:00');if(d.getDay()===0){do d.setDate(d.getDate()+1);while(h.has(dateStr(d)));h.set(dateStr(d),'振替休日')}}return holidayCache[y]=h}
function nonWorkingDay(d=today()){const x=new Date(d+'T00:00:00'),weekend=x.getDay()===0||x.getDay()===6,holiday=japaneseHolidays(x.getFullYear()).get(d);return weekend?'土日':holiday||''}
function attendance(n,d=today()){return state.attendance?.[d]?.[n]||''}
function explicitRecord(tab,n,d){return tab.records?.[n]?.[d]||null}
function isScheduledDate(tab,d){
  if(!tab||!d||d<(tab.createdAt||d))return false;
  if(tab.mode==='manual')return d===anchorDate(tab);
  const type=tab.repeat?.type||'daily',day=new Date(d+'T00:00:00').getDay();
  if(type==='weekday')return day>=1&&day<=5;
  if(type==='weekly')return day===new Date(anchorDate(tab)+'T00:00:00').getDay();
  if(type==='custom')return (tab.repeat?.days||[]).map(Number).includes(day);
  return true;
}
function manualTargetDate(tab,n){
  if(tab.submissionDate)return tab.submissionDate;
  if(tab.dueDate)return tab.dueDate;
  const recorded=Object.keys(tab.records?.[n]||{}).sort();
  return recorded[0]||tab.createdAt||today();
}
function getTargetDatesForStudent(tab,n,startDate,endDate){
  if(!tab||n<1||n>tab.count||!startDate||!endDate)return[];
  const end=endDate<today()?endDate:today();
  if(startDate>end)return[];
  if(tab.mode==='manual'){
    const target=manualTargetDate(tab,n);
    return target>=startDate&&target<=end?[target]:[];
  }
  const start=tab.createdAt&&tab.createdAt>startDate?tab.createdAt:startDate;
  if(start>end)return[];
  return dateRange(start,end).filter(d=>isScheduledDate(tab,d));
}
function isApplicable(tab,n,d){return n<=tab.count&&(isScheduledDate(tab,d)||!!explicitRecord(tab,n,d))}
function record(tab,n,d=today()){
  const saved=explicitRecord(tab,n,d),applicable=isApplicable(tab,n,d);
  if(!applicable)return{status:'notTarget',note:'対象日ではありません',automatic:true};
  if(attendance(n,d)==='absent')return{status:'absent',note:'欠席',automatic:true};
  if(tab.exemptDates?.[d])return{status:'exempt',note:tab.exemptDates[d],automatic:true};
  if(state.settings.autoExemptNonWorking&&nonWorkingDay(d))return{status:'exempt',note:nonWorkingDay(d),automatic:true};
  if(saved)return saved;
  return{status:'missing',note:''};
}
function isDoneStatus(s){return s==='submitted'||s==='late'}
function isExcludedStatus(s){return s==='exempt'||s==='absent'||s==='notTarget'}
function dailyStats(tab,d=today()){
  let total=0,done=0,late=0,excluded=0;const missing=[];
  for(let n=1;n<=tab.count;n++){const r=record(tab,n,d);if(r.status==='notTarget')continue;if(isExcludedStatus(r.status)){excluded++;continue}total++;if(isDoneStatus(r.status)){done++;if(r.status==='late')late++}else missing.push(n)}
  return{total,done,late,excluded,missing,pct:total?Math.round(done/total*100):0,scheduled:isScheduledDate(tab,d)};
}
function deadline(tab){if(!tab.dueDate)return'';const x=Math.round((new Date(tab.dueDate+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);return x===0?'今日締切':x===1?'明日締切':x>1?`あと${x}日`:`${-x}日超過`}
function datesForPeriod(p){const now=today();if(p==='today')return[now];let start=now;if(p==='week'){const d=new Date(now+'T00:00:00'),day=(d.getDay()+6)%7;start=addDays(now,-day)}else if(p==='7')start=addDays(now,-6);else if(p==='month')start=now.slice(0,7)+'-01';else if(p==='30')start=addDays(now,-29);else{const candidates=state.tabs.flatMap(t=>[t.createdAt,anchorDate(t),...Object.values(t.records||{}).flatMap(x=>Object.keys(x))]).filter(Boolean).sort();start=candidates[0]||now;if((new Date(now)-new Date(start))/86400000>3650)start=addDays(now,-3650)}return dateRange(start,now)}
function aggregate(dates=datesForPeriod(ui.period)){let total=0,done=0,late=0,overdue=0,excluded=0;if(!dates.length)return{total,done,missing:0,late,overdue,excluded,pct:0};const start=dates[0],end=dates[dates.length-1];state.tabs.forEach(t=>{for(let n=1;n<=t.count;n++)getTargetDatesForStudent(t,n,start,end).forEach(d=>{const r=record(t,n,d);if(isExcludedStatus(r.status)){excluded++;return}total++;if(isDoneStatus(r.status))done++;if(r.status==='late')late++;if(['missing','resubmit','pending'].includes(r.status)&&t.dueDate&&d>t.dueDate)overdue++})});return{total,done,missing:total-done,late,overdue,excluded,pct:total?Math.round(done/total*100):0}}
function tabDashboardDate(tab){return tab.mode==='manual'?anchorDate(tab):today()}
function render(){renderNav();$('#classTitle').textContent=state.settings.className||'学習トラッカー';$('#app').innerHTML=state.activeView==='dashboard'?dashboardHTML():tabHTML(activeTab());bindDynamic()}
function renderNav(){let h=`<button class="navbtn ${state.activeView==='dashboard'?'active':''}" data-view="dashboard">📊 ダッシュボード</button>`;state.tabs.forEach(t=>h+=`<button class="navbtn ${state.activeView==='tab'&&state.activeId===t.id?'active':''}" data-tab="${t.id}"><span style="color:${COLORS[t.color]||COLORS.green}">●</span> ${esc(t.name)}</button>`);h+=`<button class="navbtn" data-action="add-tab">＋ 新しい提出物</button>`;$('#nav').innerHTML=h}
function dashboardHTML(){const a=aggregate(),todayA=aggregate([today()]),full=state.tabs.filter(t=>{const s=dailyStats(t,tabDashboardDate(t));return s.total>0&&s.done===s.total}).length;return`<section class="section"><div class="section-title"><div><h2>提出状況ダッシュボード</h2><span class="muted">${new Intl.DateTimeFormat('ja-JP',{dateStyle:'full'}).format(new Date())}</span></div><select class="btn" id="period">${[['today','今日'],['week','今週'],['7','過去7日'],['month','今月'],['30','過去30日'],['all','全期間']].map(x=>`<option value="${x[0]}" ${ui.period===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="summary"><div class="card metric rate"><span>全体提出率（対象日のみ）</span><strong>${a.pct}%</strong><div class="progress"><span style="width:${a.pct}%"></span></div></div><div class="card metric"><span>提出物</span><strong>${state.tabs.length}<small> 項目</small></strong></div><div class="card metric"><span>今日 提出済み</span><strong>${todayA.done}<small> 件</small></strong></div><div class="card metric"><span>今日 未提出</span><strong>${todayA.missing}<small> 件</small></strong></div><div class="card metric"><span>全員提出</span><strong>${full}<small> 項目</small></strong></div></div><div class="row tiny muted" style="margin-top:8px">選択期間：遅れて提出 ${a.late}件・期限超過 ${a.overdue}件・欠席／免除 ${a.excluded}件（率から除外）</div></section>${submissionCards()}<div class="two-col section"><section class="card"><div class="section-title"><h3>今日の未提出者一覧</h3><select id="missingSort" class="btn"><option value="number">出席番号順</option><option value="count">未提出数が多い順</option><option value="name">名前順</option></select></div>${missingPeople()}</section><section class="card"><h3>確認したい児童</h3>${watchPeople()}</section></div>${chartsHTML()}`}
function submissionCards(){if(!state.tabs.length)return`<section class="card empty section">提出物がありません。「＋ 新しい提出物」から追加してください。</section>`;return`<section class="section"><div class="section-title"><h2>提出物一覧</h2><button class="btn" data-action="print">🖨️ 印刷</button></div><div class="cards">${state.tabs.map(t=>{const d=tabDashboardDate(t),s=dailyStats(t,d),dl=deadline(t),dateLabel=t.mode==='manual'?`対象日 ${d}`:'今日';return`<article class="card item-card" data-tab="${t.id}" tabindex="0" style="border-top-color:${COLORS[t.color]||COLORS.green}"><div class="item-head"><h3>${esc(t.name)}</h3><span class="pill">${t.mode==='daily'?'継続型':'1回型'}</span></div><div class="tiny muted">${dateLabel}</div><div class="bigline">${s.done} / ${s.total}</div><div class="muted">提出率 ${s.pct}% ・ 未提出 ${s.missing.length}人${s.excluded?` ・ 除外 ${s.excluded}人`:''}</div><div class="progress"><span style="width:${s.pct}%;background:${COLORS[t.color]||COLORS.green}"></span></div>${dl?`<p class="deadline">⏰ ${dl}${t.dueTime?' '+esc(t.dueTime):''}</p>`:''}<div class="missing ${s.total>0&&!s.missing.length?'success':''}">${s.total===0?'この日は提出対象ではありません':s.missing.length?`<b>未提出</b><br>${s.missing.map(n=>`${n} ${esc(nameOf(t,n))}`).join('　')}`:'全員提出 🎉'}</div><button class="btn" style="margin-top:10px" data-tab="${t.id}">詳細を開く</button></article>`}).join('')}</div></section>`}
function missingData(){const map={};state.tabs.filter(t=>isScheduledDate(t,today())).forEach(t=>dailyStats(t,today()).missing.forEach(n=>{map[n]??=[];map[n].push(t.name)}));const arr=Object.entries(map).map(([n,items])=>({n:+n,name:nameOf(state.tabs[0]||{},n),items}));if(ui.sort==='count')arr.sort((a,b)=>b.items.length-a.items.length||a.n-b.n);else if(ui.sort==='name')arr.sort((a,b)=>a.name.localeCompare(b.name,'ja'));else arr.sort((a,b)=>a.n-b.n);return arr}
function missingPeople(){const a=missingData();return a.length?a.map(x=>`<div class="person-row"><div><b>${x.n}番 ${esc(x.name)}</b><br><span class="muted">${x.items.map(esc).join('・')}</span></div><button class="btn" data-person="${x.n}">個人記録</button></div>`).join(''):`<div class="empty success">今日の未提出はありません 🎉</div>`}
function studentOverallRate(n,days){let total=0,done=0;if(!days.length)return 100;state.tabs.forEach(t=>getTargetDatesForStudent(t,n,days[0],days[days.length-1]).forEach(d=>{const r=record(t,n,d);if(isExcludedStatus(r.status))return;total++;if(isDoneStatus(r.status))done++}));return total?Math.round(done/total*100):100}
function watchPeople(){const seven=datesForPeriod('7'),a=missingData().map(x=>({...x,rate:studentOverallRate(x.n,seven)})).filter(x=>x.items.length>=2||x.rate<80);return a.length?a.slice(0,8).map(x=>`<div class="person-row"><div><b>${x.n}番 ${esc(x.name)}</b><br><span class="tiny muted">過去7日 ${x.rate}%・今日の未提出 ${x.items.length}件</span></div><button class="btn" data-person="${x.n}">確認</button></div>`).join(''):`<div class="empty">現在、確認条件に当てはまる児童はいません。</div>`}
function chartsHTML(){const ds=datesForPeriod(ui.period==='30'?'30':'7'),vals=ds.map(d=>aggregate([d]).pct);return`<section class="section"><div class="section-title"><h2>集計グラフ</h2></div><div class="two-col"><div class="card"><h3>日別提出率</h3><div class="chart-wrap"><div class="chart">${vals.map((v,i)=>`<div class="bar" style="height:${Math.max(v,2)}%"><b>${v}%</b><span>${ds[i].slice(5).replace('-','/')}</span></div>`).join('')}</div></div></div><div class="card"><h3>提出物別提出率</h3>${state.tabs.map(t=>{const s=dailyStats(t,tabDashboardDate(t));return`<div class="hbar"><span>${esc(t.name)}</span><div><i style="width:${s.pct}%;background:${COLORS[t.color]||COLORS.green}"></i></div><b>${s.pct}%</b></div>`}).join('')||'<div class="empty">データなし</div>'}<h3>曜日別傾向</h3>${weekdayBars()}</div></div></section>`}
function weekdayBars(){const days=datesForPeriod('30'),names=['日','月','火','水','木','金','土'];return[1,2,3,4,5].map(w=>{const d=days.filter(x=>new Date(x+'T00:00:00').getDay()===w),p=d.length?Math.round(d.reduce((a,x)=>a+aggregate([x]).pct,0)/d.length):0;return`<div class="hbar"><span>${names[w]}曜日</span><div><i style="width:${p}%"></i></div><b>${p}%</b></div>`}).join('')}
function tabHTML(t){if(!t)return`<div class="card empty">提出物を選択してください。</div>`;const d=viewingDate(),nums=[];for(let n=1;n<=t.count;n++){const r=record(t,n,d),over=['missing','resubmit','pending'].includes(r.status)&&t.dueDate&&d>t.dueDate,match=ui.filter==='all'||(ui.filter==='overdue'&&over)||r.status===ui.filter,q=ui.query.trim(),search=!q||String(n).includes(q)||nameOf(t,n).includes(q);if(match&&search)nums.push(n)}const s=dailyStats(t,d),label=d===today()?'今日':new Intl.DateTimeFormat('ja-JP',{dateStyle:'long'}).format(new Date(d+'T00:00:00'));return`<div class="section-title"><div><h2>${esc(t.name)}</h2><span class="muted">${label} ${s.done}/${s.total}（${s.pct}%）${!s.scheduled?'・この日は通常の対象日ではありません':''}</span></div><div class="actions"><button class="btn primary" data-action="calendar">📅 カレンダー</button><button class="btn" data-action="person-dashboard">📊 個人記録</button><button class="btn" data-action="exempt-days">🏖️ 免除日登録</button><button class="btn" data-action="edit-tab">⚙️ 提出物設定</button></div></div>${!s.scheduled?'<div class="notice section">この日は通常の提出対象日ではありません。児童をクリックして記録した場合は、臨時の対象日として個人履歴に残ります。</div>':''}<div class="progress section"><span style="width:${s.pct}%;background:${COLORS[t.color]||COLORS.green}"></span></div><div class="card section"><div class="toolbar"><div class="filters">${[['all','全員'],['submitted','提出済み'],['missing','未提出'],['late','遅れて提出'],['overdue','期限超過'],['notTarget','対象外']].map(x=>`<button class="btn ${ui.filter===x[0]?'active':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div><div class="row"><input id="search" class="search" value="${esc(ui.query)}" placeholder="番号・名前を検索" aria-label="児童を検索"><button class="btn" data-layout="${ui.layout==='tile'?'list':'tile'}">${ui.layout==='tile'?'☷ 一覧':'▦ タイル'}</button></div></div><div class="toolbar"><div class="actions"><button class="btn primary" data-bulk="submitted">表示中を提出済み</button><button class="btn" data-bulk="missing">表示中を未提出</button><button class="btn" data-bulk="exempt">表示中を免除</button><button class="btn ${ui.selecting?'active':''}" data-action="select">☑ 複数選択</button></div><span class="muted">${nums.length}人を表示</span></div>${ui.layout==='tile'?tileGrid(t,nums,d):listView(t,nums,d)}</div><div class="actions"><button class="btn" data-action="check-all">✅ 全員チェック</button><button class="btn danger" data-action="reset-today">${label}分リセット</button><button class="btn danger" data-action="reset-all">全記録リセット</button></div>`}
function tileGrid(t,nums,d=viewingDate()){return`<div class="grid">${nums.map(n=>{const r=record(t,n,d),sel=ui.selected.has(n);return`<button class="tile ${r.status}" data-student="${n}" aria-label="${n}番 ${esc(nameOf(t,n))} ${STATUSES[r.status]?.[0]||'未提出'}" aria-pressed="${isDoneStatus(r.status)}" style="${sel?'outline:4px solid #fbbf24':''}"><span class="mark">${STATUSES[r.status]?.[1]||'○'}</span><span class="num">${n}</span><span class="name">${esc(nameOf(t,n)||'名前未登録')}</span><span class="tiny">${STATUSES[r.status]?.[0]||'未提出'}</span></button>`}).join('')}</div>`}
function listView(t,nums,d=viewingDate()){return`<div style="overflow:auto"><table class="list-table"><thead><tr><th>番号</th><th>名前</th><th>状態</th><th>提出日</th><th>遅れ</th><th>メモ</th></tr></thead><tbody>${nums.map(n=>{const r=record(t,n,d),submittedDate=r.submittedAt?.slice(0,10)||'',late=r.status==='late'&&t.dueDate&&submittedDate?Math.max(0,Math.ceil((new Date(submittedDate)-new Date(t.dueDate))/86400000)):0;return`<tr data-student="${n}" tabindex="0"><td>${n}</td><td><b>${esc(nameOf(t,n)||'—')}</b></td><td>${STATUSES[r.status]?.[1]} ${STATUSES[r.status]?.[0]}</td><td>${esc(submittedDate||'—')}</td><td>${late?late+'日':'—'}</td><td>${esc(r.note||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function bindDynamic(){const p=$('#period');if(p)p.onchange=e=>{ui.period=e.target.value;render()};const s=$('#missingSort');if(s){s.value=ui.sort;s.onchange=e=>{ui.sort=e.target.value;render()}}const q=$('#search');if(q){q.oninput=e=>{ui.query=e.target.value;render();const n=$('#search');n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}
function setRecord(t,n,status,note,d=viewingDate()){t.records[n]??={};if(status==='missing'){t.records[n][d]={status:'missing',submittedAt:null,note:note||''}}else if(status==='notTarget'){delete t.records[n][d]}else t.records[n][d]={status,submittedAt:['submitted','late'].includes(status)?localStamp():null,note:note??t.records[n][d]?.note??''};if(!Object.keys(t.records[n]).length)delete t.records[n];save()}
function toggleStudent(n){const t=activeTab(),r=record(t,n,viewingDate());setRecord(t,n,r.status==='submitted'?'missing':'submitted');if(state.settings.sound&&r.status!=='submitted')beep();render()}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=720;g.gain.value=.08;o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.13);o.stop(c.currentTime+.14)}catch(e){}}
function modal(html,wide=false){lastFocus=document.activeElement;$('#modalRoot').innerHTML=`<div class="modal-layer" role="presentation"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true">${html}</section></div>`;setTimeout(()=>$('.modal input,.modal button')?.focus())}
function closeModal(){$('#modalRoot').innerHTML='';lastFocus?.focus()}
function tabForm(t={}){const repeat=t.repeat?.type||'daily',days=t.repeat?.days||[];modal(`<h2>${t.id?'提出物設定':'新しい提出物'}</h2><form id="tabForm"><div class="formgrid"><div class="field"><label>提出物名</label><input class="input" name="name" required value="${esc(t.name||'')}"></div><div class="field"><label>児童数</label><input class="input" name="count" type="number" min="1" max="300" value="${t.count||state.settings.defaultCount}"></div><div class="field"><label>種類</label><select class="input" name="mode"><option value="daily">継続型（宿題・毎日の提出）</option><option value="manual" ${t.mode==='manual'?'selected':''}>1回型（作品・プリントなど）</option></select></div><div class="field"><label>色</label><select class="input" name="color">${Object.keys(COLORS).map(c=>`<option ${t.color===c?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>対象日／提出日</label><input class="input" name="submissionDate" type="date" value="${esc(t.submissionDate||'')}"><small class="muted">1回型では、この日だけを提出対象として集計します。</small></div><div class="field"><label>締切日・時刻</label><div class="row"><input class="input" style="flex:2" name="dueDate" type="date" value="${esc(t.dueDate||'')}"><input class="input" style="flex:1" name="dueTime" type="time" value="${esc(t.dueTime||'')}"></div></div><div class="field"><label>継続型の頻度</label><select class="input" name="repeat"><option value="daily" ${repeat==='daily'?'selected':''}>毎日</option><option value="weekday" ${repeat==='weekday'?'selected':''}>平日のみ</option><option value="weekly" ${repeat==='weekly'?'selected':''}>毎週（対象日と同じ曜日）</option><option value="custom" ${repeat==='custom'?'selected':''}>曜日指定</option></select></div><div class="field"><label>曜日指定</label><div class="weekday-box">${[['日',0],['月',1],['火',2],['水',3],['木',4],['金',5],['土',6]].map(([label,v])=>`<label><input type="checkbox" name="repeatDay" value="${v}" ${days.includes(v)?'checked':''}> ${label}</label>`).join('')}</div></div><div class="field" style="grid-column:1/-1"><label>備考</label><input class="input" name="note" value="${esc(t.note||'')}"></div></div><div class="actions"><button class="btn primary">保存</button><button type="button" class="btn" data-close>キャンセル</button>${t.id?'<button type="button" class="btn danger" data-delete-tab>削除</button>':''}</div></form>`);$('#tabForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),v=Object.fromEntries(fd);v.count=+v.count;v.repeat={type:v.repeat||'daily',days:fd.getAll('repeatDay').map(Number)};delete v.repeatDay;if(t.id)Object.assign(t,v);else{v.id=uid();v.createdAt=today();v.labels={};v.records={};v.exemptDates={};state.tabs.push(v);state.activeId=v.id;state.activeView='tab'}save();closeModal();render();toast('提出物を保存しました')}}
function exemptDaysModal(){const t=activeTab(),month=viewingDate().slice(0,7),registered=Object.entries(t.exemptDates||{}).sort();modal(`<h2>🏖️ 免除日登録</h2><p class="muted">「${esc(t.name)}」だけに適用します。免除・欠席は提出率の分母から除外されます。</p><div class="field"><label>土日・祝日をまとめて登録する月</label><input class="input" id="exemptMonth" type="month" value="${month}"></div><div class="actions"><button class="btn primary" data-register-holidays>土日・祝日を登録</button></div><hr><div class="field"><label>任意の免除日</label><div class="row"><input class="input" id="customExemptDate" type="date" value="${viewingDate()}"><input class="input" id="customExemptReason" value="学校行事" placeholder="理由"><button class="btn" data-register-exempt>登録</button></div></div><h3>登録済み</h3>${registered.map(([d,n])=>`<div class="person-row"><span>${d}　${esc(n)}</span><button class="btn danger" data-remove-exempt="${d}">解除</button></div>`).join('')||'<p class="muted">個別に登録した免除日はありません。</p>'}<div class="actions"><button class="btn" data-close>閉じる</button></div>`)}
function calendarModal(){const t=activeTab(),base=new Date((ui.calendarMonth||viewingDate().slice(0,7))+'-01T00:00:00'),y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7)),days=[];for(let i=0;i<42;i++){const x=new Date(start);x.setDate(start.getDate()+i);const d=dateStr(x),st=dailyStats(t,d),target=isScheduledDate(t,d);days.push(`<button class="calendar-day ${x.getMonth()!==m?'other':''} ${d===viewingDate()?'selected':''} ${d===today()?'today':''} ${!target?'nontarget':''}" data-calendar-date="${d}"><b>${x.getDate()}</b><small>${target?`${st.done}/${st.total} 提出`:'対象外'}</small></button>`)}const title=new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long'}).format(base);modal(`<div class="calendar-head"><button class="btn" data-calendar-move="-1" aria-label="前の月">←</button><h2>${title}</h2><button class="btn" data-calendar-move="1" aria-label="次の月">→</button></div><p class="muted">日付を選ぶと、その日の提出状況に戻って記入・修正できます。</p><div class="calendar-grid">${['月','火','水','木','金','土','日'].map(x=>`<div class="calendar-weekday">${x}</div>`).join('')}${days.join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" data-calendar-date="${today()}">今日へ</button><button class="btn" data-close>閉じる</button></div>`,true)}
function studentRangeBounds(){const end=today();if(ui.studentRange==='30')return{start:addDays(end,-29),end};if(ui.studentRange==='all'){const candidates=state.tabs.flatMap(t=>[t.createdAt,anchorDate(t),...Object.values(t.records||{}).flatMap(x=>Object.keys(x))]).filter(Boolean).sort();let start=candidates[0]||end;if((new Date(end)-new Date(start))/86400000>3650)start=addDays(end,-3650);return{start,end}}const month=ui.studentMonth||viewingDate().slice(0,7),start=month+'-01',last=dateStr(new Date(+month.slice(0,4),+month.slice(5,7),0));return{start,end:last>end?end:last}}
function studentDates(tab,n){const {start,end}=studentRangeBounds();return getTargetDatesForStudent(tab,n,start,end)}
function studentTabStats(tab,n,startDate,endDate){const bounds=startDate&&endDate?{start:startDate,end:endDate}:studentRangeBounds(),dates=getTargetDatesForStudent(tab,n,bounds.start,bounds.end),counts={submitted:0,late:0,exempt:0,missing:0,resubmit:0,pending:0,absent:0,notTarget:0};dates.forEach(d=>{const k=record(tab,n,d).status;counts[k]=(counts[k]||0)+1});const target=counts.submitted+counts.late+counts.missing+counts.resubmit+counts.pending,done=counts.submitted+counts.late,incomplete=counts.missing+counts.resubmit+counts.pending;return{...counts,dates,total:dates.length,target,done,incomplete,excluded:counts.exempt+counts.absent,rate:target?Math.round(done/target*100):0}}
function rangeLabel(){if(ui.studentRange==='30')return'最近30日';if(ui.studentRange==='all')return'全期間';return new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long'}).format(new Date((ui.studentMonth||viewingDate().slice(0,7))+'-01T00:00:00'))}
function studentModal(n,tab=activeTab()||state.tabs[0]){if(!tab)return;ui.studentMonth=ui.studentMonth||viewingDate().slice(0,7);const d=viewingDate(),r=record(tab,n,d),perTab=state.tabs.filter(t=>n<=t.count).map(t=>({tab:t,stats:studentTabStats(t,n)}));const overall=perTab.reduce((a,x)=>{a.done+=x.stats.done;a.target+=x.stats.target;a.missing+=x.stats.incomplete;a.excluded+=x.stats.excluded;return a},{done:0,target:0,missing:0,excluded:0});overall.rate=overall.target?Math.round(overall.done/overall.target*100):0;const rows=[];perTab.forEach(({tab:t,stats})=>stats.dates.forEach(date=>{const x=record(t,n,date);rows.push({date,tab:t,status:x.status,note:x.note||'',saved:!!explicitRecord(t,n,date)})}));rows.sort((a,b)=>b.date.localeCompare(a.date)||a.tab.name.localeCompare(b.tab.name,'ja'));modal(`<h2>📊 ${n}番 ${esc(nameOf(tab,n)||'名前未登録')} の個人ダッシュボード</h2><p class="muted">未提出のままの日も含め、提出物の「対象日」から履歴を再構成して集計します。免除日と欠席日は提出率から除外します。</p><div class="rangebar"><div class="field"><label>集計範囲</label><select class="input" id="studentRange"><option value="month" ${ui.studentRange==='month'?'selected':''}>月別</option><option value="30" ${ui.studentRange==='30'?'selected':''}>最近30日</option><option value="all" ${ui.studentRange==='all'?'selected':''}>全期間</option></select></div><div class="field"><label>月</label><input class="input" id="studentMonth" type="month" max="${today().slice(0,7)}" value="${ui.studentMonth}" ${ui.studentRange!=='month'?'disabled':''}></div><button class="btn primary" data-student-refresh="${n}">集計し直す</button></div><div class="overall-box"><section class="card overall-rate"><span>総合提出率</span><strong>${overall.rate}%</strong><div class="progress"><span style="width:${overall.rate}%"></span></div><small class="muted">${rangeLabel()}</small></section><section class="card"><span>提出済み</span><div class="bigline">${overall.done}</div><small>対象 ${overall.target}件</small></section><section class="card"><span>未完了</span><div class="bigline">${overall.missing}</div><small>未提出・再提出・確認待ち</small></section><section class="card"><span>除外</span><div class="bigline">${overall.excluded}</div><small>欠席・免除</small></section></div><div class="person-dashboard">${perTab.map(({tab:t,stats:x})=>`<section class="card person-stat" style="border-left-color:${COLORS[t.color]||COLORS.green}"><h3>${esc(t.name)}</h3><div class="bigline">提出率 ${x.rate}%</div><p><b>${x.done}件提出 / ${x.target}対象件</b></p><div class="statline"><span><b>${x.submitted}</b><small>提出済み</small></span><span><b>${x.late}</b><small>遅れて提出</small></span><span><b>${x.incomplete}</b><small>未完了</small></span><span><b>${x.excluded}</b><small>免除・欠席</small></span></div></section>`).join('')||'<p class="empty">提出物がありません。</p>'}</div><h3>対象日ごとの記録</h3><div style="overflow:auto;max-height:360px"><table class="list-table"><thead><tr><th>日付</th><th>提出物</th><th>状態</th><th>メモ</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.tab.name)}</td><td><span class="status-text ${x.status}">${STATUSES[x.status]?.[1]} ${STATUSES[x.status]?.[0]}</span>${!x.saved&&x.status==='missing'?'<br><small class="muted">自動判定</small>':''}</td><td>${esc(x.note||'')}</td><td><button class="btn" data-open-history="1" data-tab-id="${x.tab.id}" data-date="${x.date}" data-num="${n}">開く</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">この期間の対象日はありません。</td></tr>'}</tbody></table></div><h3>「${esc(tab.name)}」の${d===today()?'今日':d}の状態</h3>${r.automatic?`<p class="pill">自動判定：${esc(r.note)}</p>`:''}<div class="field"><div class="status-grid">${Object.entries(STATUSES).filter(([k])=>k!=='notTarget').map(([k,v])=>`<button class="btn ${r.status===k?'active':''}" data-status="${k}" data-num="${n}">${v[1]} ${v[0]}</button>`).join('')}</div></div><div class="field"><label>${d===today()?'今日':d}の記録メモ</label><textarea class="input" id="recordNote" rows="2">${esc(r.status==='notTarget'?'':r.note||'')}</textarea></div><div class="field"><label>教師用メモ（全提出物共通）</label><textarea class="input" id="studentNote" rows="2">${esc(state.studentNotes[n]||'')}</textarea></div><div class="actions"><button class="btn primary" data-save-student="${n}">メモを保存</button><button class="btn" data-close>閉じる</button></div>`,true)}
function personPickerModal(){const t=activeTab();modal(`<h2>個人記録を選択</h2><p class="muted">番号を選ぶと、すべての提出物を横断した履歴を表示します。</p><div class="grid">${Array.from({length:t.count},(_,i)=>i+1).map(n=>`<button class="tile" data-person="${n}"><span class="num">${n}</span><span class="name">${esc(nameOf(t,n)||'名前未登録')}</span></button>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn" data-close>閉じる</button></div>`,true)}
function rosterModal(){const max=Math.max(state.settings.defaultCount,...state.tabs.map(t=>t.count),1);modal(`<h2>クラス名簿</h2><p class="muted">名簿はすべての提出物に共通で使われます。</p><div style="max-height:60vh;overflow:auto"><table class="list-table"><thead><tr><th>番号</th><th>名前</th><th>欠席（今日）</th></tr></thead><tbody>${Array.from({length:max},(_,i)=>i+1).map(n=>`<tr><td>${n}</td><td><input class="input roster-name" data-num="${n}" value="${esc(state.roster[n]?.name||state.roster[n]||'')}"></td><td><input type="checkbox" class="absence" data-num="${n}" ${attendance(n)==='absent'?'checked':''}></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn primary" data-save-roster>保存</button><button class="btn" data-close>閉じる</button></div>`,true)}
function settingsModal(){const s=state.settings;modal(`<h2>全体設定</h2><div class="formgrid">${[['className','学級名',s.className],['grade','学年',s.grade],['classGroup','組',s.classGroup],['teacher','担任名',s.teacher]].map(x=>`<div class="field"><label>${x[1]}</label><input class="input setting" data-key="${x[0]}" value="${esc(x[2])}"></div>`).join('')}<div class="field"><label>標準の児童数</label><input class="input setting" data-key="defaultCount" type="number" value="${s.defaultCount}"></div><div class="field"><label>初期表示</label><select class="input setting" data-key="startView"><option value="dashboard">ダッシュボード</option><option value="last" ${s.startView==='last'?'selected':''}>最後の画面</option></select></div></div><label><input type="checkbox" id="excludeAbsent" ${s.excludeAbsent?'checked':''}> 欠席を提出率から除外</label><br><label><input type="checkbox" id="autoExemptNonWorking" ${s.autoExemptNonWorking?'checked':''}> 土日・日本の祝日を自動で免除</label><br><label><input type="checkbox" id="soundSetting" ${s.sound?'checked':''}> 効果音</label><h3>データ</h3><div class="actions"><button class="btn" data-action="export-json">JSONバックアップ</button><button class="btn" data-action="import-json">JSON読み込み</button><button class="btn" data-action="csv">CSV書き出し</button><button class="btn" data-action="print">印刷</button></div><hr><div class="field"><label>全データ削除（「削除」と入力）</label><input class="input" id="deleteConfirm"></div><div class="actions"><button class="btn primary" data-save-settings>設定を保存</button><button class="btn danger" data-delete-all>全データ削除</button><button class="btn" data-close>閉じる</button></div>`)}
function setup(){document.body.innerHTML=`<main class="setup"><section class="card"><h1>📗 学習トラッカー</h1><p>最初に学級の基本情報を設定します。名前は後から登録できます。</p><form id="setup"><div class="field"><label>学級名</label><input class="input" name="className" placeholder="例：6年1組" required></div><div class="field"><label>児童数</label><input class="input" name="count" type="number" min="1" max="300" value="30" required></div><div class="field"><label>最初の提出物</label><input class="input" name="item" value="宿題" required></div><button class="btn primary" style="width:100%">すぐ始める</button></form></section></main>`;$('#setup').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),count=+f.get('count');state.settings.className=f.get('className');state.settings.defaultCount=count;state.tabs=[{id:uid(),name:f.get('item'),count,mode:'daily',color:'green',createdAt:today(),submissionDate:'',dueDate:'',dueTime:'',repeat:{type:'weekday',days:[]},note:'',labels:{},records:{},exemptDates:{}}];save();location.reload()}}
function csvCell(v){let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return`"${s.replace(/"/g,'""')}"`}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportCSV(){const rows=[['日付','出席番号','名前','提出物名','状態','提出日時','締切日','メモ']];state.tabs.forEach(t=>{for(let n=1;n<=t.count;n++){const dates=studentDatesAll(t,n);dates.forEach(d=>{const r=record(t,n,d);rows.push([d,n,nameOf(t,n),t.name,STATUSES[r.status]?.[0],r.submittedAt||'',t.dueDate||'',r.note||''])})}});download(new Blob(['\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),`学習トラッカー-${today()}.csv`);toast('CSVを書き出しました')}
function studentDatesAll(tab,n){const end=today(),start=tab.mode==='manual'?manualTargetDate(tab,n):(tab.createdAt||end);return getTargetDatesForStudent(tab,n,start,end)}
function runSubmissionRateTests(){
  const originalState=state,results=[];
  const check=(actual,expected,label)=>{const pass=actual===expected;results.push({label,pass,expected,actual});console[pass?'log':'error'](`${pass?'✅':'❌'} ${label}: expected=${expected}, actual=${actual}`)};
  const makeTab=(records={},extra={})=>Object.assign({id:'test',name:'テスト',mode:'daily',count:1,createdAt:'2024-01-08',submissionDate:'',dueDate:'',repeat:{type:'daily',days:[]},records:{1:records},exemptDates:{}},extra);
  const verify=(label,records,expected)=>{const stats=studentTabStats(makeTab(records),1,'2024-01-08','2024-01-10');Object.entries(expected).forEach(([key,value])=>check(stats[key],value,`${label} / ${key}`))};
  try{
    state=fresh();state.settings.autoExemptNonWorking=false;
    state.attendance={'2024-01-09':{1:'absent'}};
    verify('提出・欠席・未提出',{'2024-01-08':{status:'submitted'}},{submitted:1,absent:1,missing:1,target:2,done:1,rate:50});
    state.attendance={};
    verify('提出・免除・未提出',{'2024-01-08':{status:'submitted'},'2024-01-09':{status:'exempt'}},{submitted:1,exempt:1,missing:1,target:2,done:1,rate:50});
    verify('全日未操作',{},{missing:3,target:3,done:0,rate:0});
    verify('全日提出',{'2024-01-08':{status:'submitted'},'2024-01-09':{status:'submitted'},'2024-01-10':{status:'submitted'}},{target:3,done:3,rate:100});
    verify('提出・未提出・未提出',{'2024-01-08':{status:'submitted'}},{target:3,done:1,rate:33});
    verify('提出・免除・提出',{'2024-01-08':{status:'submitted'},'2024-01-09':{status:'exempt'},'2024-01-10':{status:'submitted'}},{target:2,done:2,rate:100});
    check(getTargetDatesForStudent(makeTab({}, {createdAt:'2024-01-09'}),1,'2024-01-08','2024-01-10').join(','),'2024-01-09,2024-01-10','開始日前を除外');
    const futureTab=makeTab({}, {createdAt:today()});check(getTargetDatesForStudent(futureTab,1,today(),addDays(today(),2)).join(','),today(),'未来日を除外');
    const manual=makeTab({}, {mode:'manual',createdAt:'2024-01-08',submissionDate:'2024-01-09'});check(getTargetDatesForStudent(manual,1,'2024-01-08','2024-01-10').join(','),'2024-01-09','1回型は対象日1日だけ');
  }finally{state=originalState}
  const passed=results.filter(x=>x.pass).length,summary={success:passed===results.length,passed,total:results.length,results};console[summary.success?'log':'error'](`${summary.success?'✅':'❌'} 提出率テスト: ${passed}/${results.length}件成功`);return summary;
}
document.addEventListener('click',e=>{
  if(e.target.classList.contains('modal-layer')){closeModal();return}
  const b=e.target.closest('button,[data-tab],[data-student]');if(!b)return;const act=b.dataset.action;
  if(b.dataset.studentRefresh){ui.studentRange=$('#studentRange').value;ui.studentMonth=$('#studentMonth').value||today().slice(0,7);studentModal(+b.dataset.studentRefresh,activeTab()||state.tabs[0])}
  else if(b.dataset.openHistory){state.activeId=b.dataset.tabId;state.activeView='tab';ui.selectedDate=b.dataset.date;closeModal();render();setTimeout(()=>studentModal(+b.dataset.num,activeTab()),0)}
  else if(b.dataset.registerHolidays!==undefined){const t=activeTab(),month=$('#exemptMonth').value;if(!month)return;let d=new Date(month+'-01T00:00:00');t.exemptDates??={};while(dateStr(d).startsWith(month)){const day=dateStr(d),reason=nonWorkingDay(day);if(reason)t.exemptDates[day]=reason;d.setDate(d.getDate()+1)}save();exemptDaysModal();toast(`${month}の土日・祝日を登録しました`)}
  else if(b.dataset.registerExempt!==undefined){const t=activeTab(),d=$('#customExemptDate').value;if(!d)return;t.exemptDates??={};t.exemptDates[d]=$('#customExemptReason').value.trim()||'免除日';save();exemptDaysModal();toast('免除日を登録しました')}
  else if(b.dataset.removeExempt){delete activeTab().exemptDates[b.dataset.removeExempt];save();exemptDaysModal();toast('免除日を解除しました')}
  else if(b.dataset.calendarDate){ui.selectedDate=b.dataset.calendarDate;ui.calendarMonth=ui.selectedDate.slice(0,7);closeModal();render();toast(`${ui.selectedDate}の記録を表示しています`)}
  else if(b.dataset.calendarMove){const x=new Date((ui.calendarMonth||viewingDate().slice(0,7))+'-01T00:00:00');x.setMonth(x.getMonth()+(+b.dataset.calendarMove));ui.calendarMonth=dateStr(x).slice(0,7);calendarModal()}
  else if(b.dataset.view){state.activeView='dashboard';save();render()}
  else if(b.dataset.tab){state.activeId=b.dataset.tab;state.activeView='tab';ui.filter='all';save();render()}
  else if(b.dataset.filter){ui.filter=b.dataset.filter;render()}
  else if(b.dataset.layout){ui.layout=b.dataset.layout;render()}
  else if(b.dataset.student){const n=+b.dataset.student;if(longPressed){longPressed=false;return}if(ui.selecting){ui.selected.has(n)?ui.selected.delete(n):ui.selected.add(n);render()}else toggleStudent(n)}
  else if(b.dataset.person)studentModal(+b.dataset.person,activeTab()||state.tabs[0])
  else if(b.dataset.status){const t=activeTab()||state.tabs[0],n=+b.dataset.num;if(b.dataset.status==='absent'){state.attendance[viewingDate()]??={};state.attendance[viewingDate()][n]='absent';save()}else{if(state.attendance[viewingDate()])delete state.attendance[viewingDate()][n];setRecord(t,n,b.dataset.status,$('#recordNote')?.value)}studentModal(n,t);render()}
  else if(b.dataset.bulk){const t=activeTab(),nums=$$('[data-student]').map(x=>+x.dataset.student);if(confirm(`${nums.length}人の状態を変更しますか？`)){nums.forEach(n=>setRecord(t,n,b.dataset.bulk));render()}}
  else if(b.dataset.close!==undefined)closeModal()
  else if(b.dataset.saveStudent){const n=+b.dataset.saveStudent,t=activeTab()||state.tabs[0],r=record(t,n,viewingDate());if(r.status!=='absent'&&r.status!=='notTarget')setRecord(t,n,r.status,$('#recordNote').value);state.studentNotes[n]=$('#studentNote').value;save();closeModal();render();toast('メモを保存しました')}
  else if(b.dataset.saveRoster!==undefined){state.attendance[today()]={};$$('.roster-name').forEach(x=>{const n=x.dataset.num,v=x.value.trim();if(v)state.roster[n]={name:v,note:state.roster[n]?.note||''};else delete state.roster[n]});$$('.absence:checked').forEach(x=>state.attendance[today()][x.dataset.num]='absent');save();closeModal();render();toast('名簿と出欠を保存しました')}
  else if(b.dataset.saveSettings!==undefined){$$('.setting').forEach(x=>state.settings[x.dataset.key]=x.type==='number'?+x.value:x.value);state.settings.excludeAbsent=$('#excludeAbsent').checked;state.settings.autoExemptNonWorking=$('#autoExemptNonWorking').checked;state.settings.sound=$('#soundSetting').checked;save();closeModal();render()}
  else if(b.dataset.deleteTab!==undefined){if(confirm('この提出物と全記録を削除しますか？')){state.tabs=state.tabs.filter(x=>x.id!==activeTab().id);state.activeView='dashboard';save();closeModal();render()}}
  else if(b.dataset.deleteAll!==undefined){if($('#deleteConfirm').value==='削除'){localStorage.removeItem(KEY);OLD_KEYS.forEach(k=>localStorage.removeItem(k));location.reload()}else toast('確認欄に「削除」と入力してください')}
  else if(act==='calendar')calendarModal();else if(act==='exempt-days')exemptDaysModal();else if(act==='person-dashboard')personPickerModal();else if(act==='add-tab')tabForm();else if(act==='edit-tab')tabForm(activeTab());else if(act==='roster')rosterModal();else if(act==='settings')settingsModal();else if(act==='sound'){state.settings.sound=!state.settings.sound;save();toast(state.settings.sound?'効果音オン':'効果音オフ')}else if(act==='select'){ui.selecting=!ui.selecting;ui.selected.clear();render()}else if(act==='check-all'){if(confirm('全員を提出済みにしますか？')){const t=activeTab();for(let n=1;n<=t.count;n++)setRecord(t,n,'submitted');render()}}else if(act==='reset-today'){if(confirm(`${viewingDate()}分の手動記録を削除しますか？`)){const t=activeTab();for(let n=1;n<=t.count;n++){if(t.records[n]){delete t.records[n][viewingDate()];if(!Object.keys(t.records[n]).length)delete t.records[n]}}save();render()}}else if(act==='reset-all'){if(confirm('この提出物の全記録を削除しますか？')){activeTab().records={};save();render()}}else if(act==='export-json')download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),`学習トラッカー-${today()}.json`);else if(act==='import-json')$('#fileInput').click();else if(act==='csv')exportCSV();else if(act==='print')window.print()
});
document.addEventListener('pointerdown',e=>{const x=e.target.closest('[data-student]');if(!x)return;longPressed=false;pressTimer=setTimeout(()=>{longPressed=true;studentModal(+x.dataset.student)},550)});
document.addEventListener('pointerup',()=>clearTimeout(pressTimer));document.addEventListener('pointermove',()=>clearTimeout(pressTimer));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Enter'&&e.target.matches('tr[data-student]'))studentModal(+e.target.dataset.student)});
$('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader;r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tabs))throw Error('tabs');if(confirm('現在のデータを読み込んだデータで置き換えますか？')){state=normalize(d);save();closeModal();render();toast('JSONを読み込みました')}}catch(err){alert('正しい学習トラッカーのJSONではありません')}e.target.value=''};r.readAsText(f)};
load();if(!state.settings.className&&!state.tabs.length)setup();else{if(state.settings.startView==='dashboard')state.activeView='dashboard';render();let currentDay=today();setInterval(()=>{const d=today();if(currentDay!==d){currentDay=d;render();toast('日付が変わりました')}},60000)}
</script>
